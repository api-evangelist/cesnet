        schema:
          type: integer
        in: query
      - name: member
        description: id of Member
        schema:
          type: integer
        in: query
      - name: group
        description: id of Group
        schema:
          type: integer
        in: query
      - name: host
        description: id of Host
        schema:
          type: integer
        in: query
      - name: userExtSource
        description: id of UserExtSource
        schema:
          type: integer
        in: query
      - name: key
        description: key for entityless attribute
        schema:
          type: string
        in: query
