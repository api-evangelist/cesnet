components:
  parameters:
    serviceId:
      name: service
      description: id of Service
      schema:
        type: integer
      in: query
      required: true
    optionalUserId:
      name: user
      description: id of User
      schema:
        type: integer
      in: query
      required: false
    voId:
      name: vo
      description: id of Vo
      schema:
        type: integer
      in: query
      required: true
    userId:
      name: user
      description: id of User
      schema:
        type: integer
      in: query
      required: true
    serviceIds:
      name: services[]
      description: list of Service ids List<Integer>
      in: query
      required: true
      schema:
        type: array
        items:
          type: integer
    optionalVoId:
      name: vo
      description: id of Vo
      schema:
        type: integer
      in: query
      required: false
    workWithGroupAttributes:
      name: workWithGroupAttributes
      description: flag to work with group attributes
      schema:
        type: boolean
      in: query
      required: true
    facilityId:
      name: facility
      description: id of Facility
      schema:
        type: integer
      in: query
      required: true
    attributes:
      name: attributes[]
      description: list of attribute ids List<Integer>
      in: query
      required: true
      schema:
        type: array
        items:
          type: integer
    attrNames:
      name: attrNames
      description: list of attribute names List<String>
      in: query
      required: true
      schema:
        type: array
        items:
          type: string
    memberId:
      name: member
      description: id of Member
      schema:
        type: integer
      in: query
      required: true
    attributeInteger:
      name: attribute
      description: id of AttributeDefinition
      schema:
        type: integer
      in: query
      required: true
    optionalMemberId:
      name: member
      description: id of Member
      schema:
        type: integer
      in: query
      required: false
    groupId:
      name: group
      description: id of Group
      schema:
        type: integer
      in: query
      required: true
    optionalResourceId:
      name: resource
      description: id of Resource
      schema:
        type: integer
      in: query
      required: false
    optionalUserExtSourceId:
      name: userExtSource
      description: id of UserExtSource
      schema:
        type: integer
      in: query
      required: false
    userExtSourceId:
      name: userExtSource
      description: id of UserExtSource
      schema:
        type: integer
      in: query
      required: true
    attrDefId:
      name: attrDefId
      description: id of AttributeDefinition
      schema:
        type: integer
      in: query
      required: true
    workWithUserAttributes:
      name: workWithUserAttributes
      description: flag to work with user attributes
      schema:
        type: boolean
      in: query
      required: true
    resourceId:
      name: resource
      description: id of Resource
      schema:
        type: integer
      in: query
      required: true
    key:
      name: key
      description: key of an entityless attribute
      schema:
        type: string
      in: query
      required: true
    hostId:
      name: host
      description: id of Host
      schema:
        type: integer
      in: query
      required: true
    optionalHostId:
      name: host
      description: id of Host
      schema:
        type: integer
      in: query
      required: false
    workWithUserAttributesOptional:
      name: workWithUserAttributes
      description: flag to work with user attributes
      schema:
        type: boolean
      in: query
      required: false
    optionalGroupId:
      name: group
      description: id of Group
      schema:
        type: integer
      in: query
      required: false
    attrName:
      name: attrName
      description: full name of attribute definition (namespace + ':' + friendlyName)
      schema:
        type: string
      in: query
      required: true
    attributeId:
      name: attributeId
      description: id of AttributeDefinition
      schema:
        type: integer
      in: query
      required: true
    attributeDefinitionId:
      name: attributeDefinition
      description: id of AttributeDefinition
      schema:
        type: integer
      in: query
      required: true
    optionalFacilityId:
      name: facility
      description: id of Facility
      schema:
        type: integer
      in: query
      required: false
    id:
      name: id
      description: numeric id
      schema:
        type: integer
      in: query
      required: true
    attributeName:
      name: attributeName
      description: full name of attribute definition (namespace + ':' + friendlyName)
      schema:
        type: string
      in: query
      required: true
  schemas:
    AttributeRules:
      type: object
      properties:
        attributePolicyCollections:
          type: array
          items:
            $ref: '#/components/schemas/AttributePolicyCollection'
        criticalActions:
          type: object
          description: Represents types of actions (READ, WRITE) that users can perform upon attributes and if they are critical globally or not.
          additionalProperties:
            type: boolean
          example:
            READ: false
            WRITE: true
    AttributeDefinition:
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        friendlyName:
          type: string
        namespace:
          type: string
        description:
          type:
          - string
          - 'null'
        type:
          type: string
        displayName:
          type: string
        writable:
          type: boolean
        unique:
          type: boolean
        friendlyNameParameter:
          type: string
          readOnly: true
        baseFriendlyName:
          type: string
          readOnly: true
        entity:
          type: string
          readOnly: true
    PerunBean:
      description: identifiable entity in Perun, common ancestor of all entity classes
      type: object
      properties:
        id:
          type: integer
        beanName:
          type: string
      required:
      - id
      - beanName
      discriminator:
        propertyName: beanName
    GraphDTO:
      properties:
        graph:
          type: string
        format:
          $ref: '#/components/schemas/GraphFileFormat'
    EntitylessAttributesByKeys:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/Attribute'
    GraphFileFormat:
      type: string
      enum:
      - DOT
      - TGF
      description: currently supported formats are DOT and TGF
