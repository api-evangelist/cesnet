openapi: 3.2.0
info:
  title: Cesnet Owners Manager API
  version: 0.0.0
  contact:
    url: https://perun-aai.org
    email: perun@cesnet.cz
  description: 'Operations tagged OwnersManager across 2 of this provider''s published API definitions: cesnet-perun-rpc-openapi.yml, cesnet-perun-rpc-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{server}/{authentication}/rpc
  description: Perun RPC server
  variables:
    server:
      default: api-dev.perun-aai.org
      description: DNS name of a Perun server
    authentication:
      default: ba
      description: 'way of authentication:

        ba - HTTP Basic Auth

        krb - Kerberos

        non - no authentication

        cert - X509 client certificate

        oauth - OAuth 2.0 bearer access token

        fed - SAML federation

        '
      enum:
      - ba
      - krb
      - non
      - cert
      - oauth
      - fed
security:
- BasicAuth: []
- BearerAuth: []
tags:
- name: OwnersManager
  description: OwnersManager RPC API in Perun
  externalDocs:
    url: https://perun-aai.org/documentation/technical-documentation/rpc-api/rpc-javadoc-OwnersManager.html
paths:
  /json/ownersManager/createOwner:
    post:
      deprecated: true
      tags:
      - OwnersManager
      operationId: createOwner
      summary: Creates a new owner
      responses:
        '200':
          $ref: '#/components/responses/OwnerResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: InputCreateOwner
              description: input to createOwner, no id, numeric ownerType instead of string type
              type: object
              required:
              - name
              - contact
              - ownerType
              properties:
                name:
                  type: string
                  description: name of contact, e.g. John Doe or NSA
                contact:
                  type: string
                  description: email address
                ownerType:
                  type: integer
                  enum:
                  - 0
                  - 1
                  description: 0 - technical, 1 - administrative
    servers:
    - url: https://{server}/{authentication}/rpc
      description: Perun RPC server
      variables:
        server:
          default: api-dev.perun-aai.org
          description: DNS name of a Perun server
        authentication:
          default: ba
          description: 'way of authentication:

            ba - HTTP Basic Auth

            krb - Kerberos

            non - no authentication

            cert - X509 client certificate

            oauth - OAuth 2.0 bearer access token

            fed - SAML federation

            '
          enum:
          - ba
          - krb
          - non
          - cert
          - oauth
          - fed
  /urlinjsonout/ownersManager/deleteOwner:
    post:
      deprecated: true
      tags:
      - OwnersManager
      operationId: deleteOwner
      summary: Deletes Owner specified by id. Returns null
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
      parameters:
      - $ref: '#/components/parameters/ownerId'
      - $ref: '#/components/parameters/forceDelete'
    servers:
    - url: https://{server}/{authentication}/rpc
      description: Perun RPC server
      variables:
        server:
          default: api-dev.perun-aai.org
          description: DNS name of a Perun server
        authentication:
          default: ba
          description: 'way of authentication:

            ba - HTTP Basic Auth

            krb - Kerberos

            non - no authentication

            cert - X509 client certificate

            oauth - OAuth 2.0 bearer access token

            fed - SAML federation

            '
          enum:
          - ba
          - krb
          - non
          - cert
          - oauth
          - fed
  /urlinjsonout/ownersManager/deleteOwners:
    post:
      deprecated: true
      tags:
      - OwnersManager
      operationId: deleteOwners
      summary: Deletes owners by ids. Returns null
      parameters:
      - $ref: '#/components/parameters/ownerIds'
      - $ref: '#/components/parameters/forceDelete'
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
