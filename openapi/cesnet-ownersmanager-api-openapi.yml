components:
  parameters:
    ownerIds:
      name: owners[]
      description: list of owner ids
      schema:
        type: array
        items:
          type: integer
      in: query
      required: true
    forceDelete:
      name: force
      description: If true, delete entity forcefully.
      schema:
        type: boolean
      in: query
      required: false
    ownerName:
      name: owner
      description: name of Owner
      schema:
        type: string
      in: query
      required: true
    id:
      name: id
      description: numeric id
      schema:
        type: integer
      in: query
      required: true
    ownerId:
      name: owner
      description: id of Owner
      schema:
        type: integer
      in: query
      required: true
  schemas:
    OwnerType:
      description: enumeration of types of Owners
      type: string
      enum:
      - technical
      - administrative
    Owner:
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        name:
          type: string
        contact:
          type: string
        type:
          $ref: '#/components/schemas/OwnerType'
    PerunBean:
      description: identifiable entity in Perun, common ancestor of all entity classes
      type: object
      properties:
        id:
          type: integer
        beanName:
          type: string
      required:
      - id
      - beanName
      discriminator:
        propertyName: beanName
    Auditable:
      description: represents audit information
      allOf:
      - $ref: '#/components/schemas/PerunBean'
      properties:
        createdAt:
          type:
          - string
          - 'null'
        createdBy:
          type:
          - string
          - 'null'
        modifiedAt:
          type:
          - string
          - 'null'
        modifiedBy:
          type:
          - string
          - 'null'
        createdByUid:
          type:
          - integer
          - 'null'
        modifiedByUid:
          type:
          - integer
          - 'null'
    PerunException:
      description: exception thrown from inside of Perun
      type: object
      properties:
        errorId:
          type: string
        name:
          type: string
        message:
          type: string
  responses:
    VoidResponse:
      description: returns nothing
    ExceptionResponse:
      description: exception occurred
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PerunException'
    ListOfOwnersResponse:
      description: returns List<Owner>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Owner'
    OwnerResponse:
      description: returns Owner
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Owner'
  securitySchemes:
    BasicAuth:
      description: HTTP Basic authentication with username and password
      type: http
      scheme: basic
    BearerAuth:
      description: 'OAuth2 Resource Server authentication using access token in ''Authorization: Bearer'' HTTP header'
      type: http
      scheme: bearer
