      operationId: getBansForFacility
      summary: Get all bans for user on the facility
      parameters:
      - name: facilityId
        description: id of Facility
        schema:
          type: integer
        in: query
        required: true
      responses:
        '200':
          $ref: '#/components/responses/ListOfBanOnFacilitiesResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/facilitiesManager/getEnrichedBansForFacility:
    get:
      tags:
      - FacilitiesManager
      operationId: getEnrichedBansForFacility
      summary: Get all enriched bans on the facility
      parameters:
      - $ref: '#/components/parameters/facilityId'
      - $ref: '#/components/parameters/attrNamesOptional'
      responses:
        '200':
          $ref: '#/components/responses/ListOfEnrichedBansOnFacilitiesResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/facilitiesManager/getEnrichedBansForUser:
    get:
      tags:
      - FacilitiesManager
      operationId: getEnricheFacilitydBansForUser
      summary: Get all user's enriched bans on assigned facilities
      parameters:
      - $ref: '#/components/parameters/userId'
      - $ref: '#/components/parameters/attrNamesOptional'
      responses:
        '200':
          $ref: '#/components/responses/ListOfEnrichedBansOnFacilitiesResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/facilitiesManager/updateBan:
    post:
      tags:
      - FacilitiesManager
      operationId: updateFacilityBan
      summary: Update existing ban (description, validation timestamp)
      responses:
        '200':
          $ref: '#/components/responses/BanOnFacilityResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: InputUpdateBanForFacility
              description: input to updateBanForFacility
              type: object
              required:
              - banOnFacility
              properties:
                banOnFacility:
                  $ref: '#/components/schemas/BanOnFacility'
  /urlinjsonout/facilitiesManager/removeBan/byId:
    post:
      tags:
      - FacilitiesManager
      operationId: removeFacilityBanById
      summary: Remove specific ban by it's id
      parameters:
      - name: banId
        schema:
          type: integer
        in: query
        required: true
        description: BanOnFacility id
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /urlinjsonout/facilitiesManager/removeBan/byUserIdFacilityId:
    post:
      tags:
      - FacilitiesManager
      operationId: removeBanByUserIdFacilityId
      summary: Remove specific ban by userId and facilityId
      parameters:
      - $ref: '#/components/parameters/userId'
      - $ref: '#/components/parameters/facilityId'
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
components:
  schemas:
    RichResource:
      allOf:
      - $ref: '#/components/schemas/Resource'
      properties:
        vo:
          $ref: '#/components/schemas/Vo'
        facility:
          $ref: '#/components/schemas/Facility'
        resourceTags:
          type: array
          items:
            $ref: '#/components/schemas/ResourceTag'
    ExtSource:
      description: represents external source of data for users such as an IdP or an HR database
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        name:
          type: string
        type:
          type: string
    BanOnFacility:
      allOf:
      - $ref: '#/components/schemas/Ban'
      properties:
        userId:
          type: integer
        facilityId:
          type: integer
    OwnerType:
      description: enumeration of types of Owners
      type: string
      enum:
      - technical
      - administrative
    Owner:
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        name:
          type: string
        contact:
          type: string
        type:
          $ref: '#/components/schemas/OwnerType'
    PerunException:
      description: exception thrown from inside of Perun
      type: object
      properties:
        errorId:
          type: string
        name:
          type: string
        message:
          type: string
    EnrichedBanOnFacility:
      type: object
      properties:
        facility:
          $ref: '#/components/schemas/Facility'
        user:
          $ref: '#/components/schemas/RichUser'
        ban:
          $ref: '#/components/schemas/BanOnFacility'
    DestinationPropagationType:
      type: string
      description: type of propagation of service settings to a destination
      enum:
      - PARALLEL
      - SERIAL
      - DUMMY
    AttributeDefinition:
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        friendlyName:
          type: string
        namespace:
          type: string
        description:
          type:
          - string
          - 'null'
        type:
          type: string
        displayName:
          type: string
        writable:
          type: boolean
        unique:
          type: boolean
        friendlyNameParameter:
          type: string
          readOnly: true
        baseFriendlyName:
          type: string
          readOnly: true
        entity:
          type: string
          readOnly: true
    PerunBean:
      description: identifiable entity in Perun, common ancestor of all entity classes
      type: object
      properties:
        id:
          type: integer
        beanName:
          type: string
      required:
      - id
      - beanName
      discriminator:
        propertyName: beanName
    Resource:
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        name:
          type: string
        description:
          type: string
        voId:
          type: integer
        facilityId:
          type: integer
        uuid:
          type: string
          format: uuid
    RichUser:
      description: user data packed together with all user attributes and UserExtSources
      allOf:
      - $ref: '#/components/schemas/User'
      properties:
        userExtSources:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/UserExtSource'
        userAttributes:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Attribute'
      required:
      - userExtSources
      - userAttributes
    EnrichedHost:
      type: object
      properties:
        host:
          $ref: '#/components/schemas/Host'
        hostAttributes:
          type: array
          items:
            $ref: '#/components/schemas/Attribute'
    Attribute:
      allOf:
      - $ref: '#/components/schemas/AttributeDefinition'
      properties:
        valueCreatedAt:
          type:
          - string
          - 'null'
        valueCreatedBy:
          type:
          - string
          - 'null'
        valueModifiedAt:
          type:
          - string
          - 'null'
        valueModifiedBy:
          type:
          - string
          - 'null'
        value: {}
    DestinationType:
      type: string
      description: type of destination, i.e. way of delivery of service settings
      enum:
      - host
      - url
      - user@host
      - user@host:port
      - service-specific
      - user@host-windows
      - host-windows-proxy
      - s3
      - s3-json
      - url-json
    Ban:
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        validityTo:
          type: string
        description:
          type: string
    RichGroup:
      allOf:
      - $ref: '#/components/schemas/Group'
      properties:
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/Attribute'
    Facility:
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        uuid:
          type: string
          format: uuid
    UserExtSource:
      description: represents specific user authentication or identification in external source of data
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        login:
          type: string
        userId:
          type: integer
        loa:
          type: integer
        persistent:
          type: boolean
        lastAccess:
          type: string
          format: timestamp
          description: SQL timestamp
          example: '2012-01-01 00:00:00.100000'
        extSource:
          $ref: '#/components/schemas/ExtSource'
      required:
      - login
      - extSource
    FacilityWithAttributes:
      type: object
      properties:
        facility:
          $ref: '#/components/schemas/Facility'
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/Attribute'
      required:
      - facility
      - attributes
    Vo:
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        name:
          type: string
        shortName:
          type: string
        uuid:
          type: string
          format: uuid
    EnrichedFacility:
      type: object
      properties:
        facility:
          $ref: '#/components/schemas/Facility'
        owners:
          type: array
          items:
            $ref: '#/components/schemas/Owner'
        destinations:
          type: array
          items:
            $ref: '#/components/schemas/Destination'
        hosts:
          type: array
          items:
            $ref: '#/components/schemas/Host'
    Host:
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        hostname:
          type: string
    Destination:
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        destination:
          type: string
        type:
          $ref: '#/components/schemas/DestinationType'
        propagationType:
          $ref: '#/components/schemas/DestinationPropagationType'
    Group:
      allOf:
      - $ref: '#/components/schemas/Auditable'
      type:
      - object
      - 'null'
      properties:
        name:
          type: string
        shortName:
          type: string
        description:
          type:
          - string
          - 'null'
        voId:
          type: integer
        parentGroupId:
          type:
          - integer
          - 'null'
        uuid:
          type: string
          format: uuid
    User:
      description: represents user as a physical person
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        firstName:
          type:
          - string
          - 'null'
        lastName:
          type:
          - string
          - 'null'
        middleName:
          type:
          - string
          - 'null'
        titleBefore:
          type:
          - string
          - 'null'
        titleAfter:
          type:
          - string
          - 'null'
        serviceUser:
          type: boolean
        sponsoredUser:
          type: boolean
        uuid:
          type: string
          format: uuid
        specificUser:
          type: boolean
        majorSpecificType:
          type: string
    Auditable:
      description: represents audit information
      allOf:
      - $ref: '#/components/schemas/PerunBean'
      properties:
        createdAt:
          type:
          - string
          - 'null'
        createdBy:
          type:
          - string
          - 'null'
        modifiedAt:
          type:
          - string
          - 'null'
        modifiedBy:
          type:
          - string
          - 'null'
        createdByUid:
          type:
          - integer
          - 'null'
        modifiedByUid:
          type:
          - integer
          - 'null'
    ResourceTag:
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        tagName:
          type: string
        voId:
          type: integer
    RichFacility:
      allOf:
      - $ref: '#/components/schemas/Facility'
      properties:
        facilityOwners:
          type: array
          items:
            $ref: '#/components/schemas/Owner'
      required:
      - facilityOwners
  parameters:
    forceDelete:
      name: force
      description: If true, delete entity forcefully.
      schema:
        type: boolean
      in: query
      required: false
    memberId:
      name: member
      description: id of Member
      schema:
        type: integer
      in: query
      required: true
    ownerId:
      name: owner
      description: id of Owner
      schema:
        type: integer
      in: query
      required: true
    listOfHostIds:
      name: hosts[]
      description: list of host ids List<Integer>
      in: query
      required: true
      schema:
        type: array
        items:
          type: integer
    attributeValue:
      name: attributeValue
      description: string value of Attribute
      schema:
        type: string
      in: query
      required: true
    groupId:
      name: group
      description: id of Group
      schema:
        type: integer
      in: query
      required: true
    ownerNames:
      name: ownerNames[]
      description: list of owner names
      schema:
        type: array
        items:
          type: string
      in: query
      required: true
    name:
      name: name
      description: name of entity
      schema:
        type: string
      in: query
      required: true
    hostId:
      name: host
      description: id of Host
      schema:
        type: integer
      in: query
      required: true
    attrNamesOptional:
      name: attrNames[]
      description: list of attribute names List<String> or null
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
    ids:
      name: ids[]
      description: list of ids List<Integer>
      in: query
      required: true
      schema:
        type: array
        items:
          type: integer
    id:
      name: id
      description: numeric id
      schema:
        type: integer
      in: query
      required: true
    ownerName:
      name: owner
      description: name of Owner
      schema:
        type: string
      in: query
      required: true
    authorizedGroup:
      name: authorizedGroup
      description: Group id
      schema:
        type: integer
      in: query
      required: true
    userId:
      name: user
      description: id of User
      schema:
        type: integer
      in: query
      required: true
    serviceId:
      name: service
      description: id of Service
      schema:
        type: integer
      in: query
      required: true
    ownerIds:
      name: owners[]
      description: list of owner ids
      schema:
        type: array
        items:
          type: integer
      in: query
      required: true
    facilityName:
      name: facility
      description: name of Facility
      schema:
        type: string
      in: query
      required: true
    facilityId:
      name: facility
      description: id of Facility
      schema:
        type: integer
      in: query
      required: true
    destinationName:
      name: destination
      description: string name of destination
      schema:
        type: string
      in: query
      required: true
    hostnames:
      name: hostnames[]
      description: list of host names List<String>
      in: query
      required: true
      schema:
        type: array
        items:
          type: string
    attrNames:
      name: attrNames
      description: list of attribute names List<String>
      in: query
      required: true
      schema:
        type: array
        items:
          type: string
    attributeName:
      name: attributeName
      description: full name of attribute definition (namespace + ':' + friendlyName)
      schema:
        type: string
      in: query
      required: true
  responses:
    ListOfFacilitiesResponse:
      description: returns List<Facility>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Facility'
    ListOfBanOnFacilitiesResponse:
      description: return List<BanOnFacility>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/BanOnFacility'
    ListOfUsersResponse:
      description: returns List<User>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/User'
    ListOfEnrichedBansOnFacilitiesResponse:
      description: return List<EnrichedBanOnFacility>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/EnrichedBanOnFacility'
    ListOfRichFacilitiesResponse:
      description: returns List<RichFacility>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/RichFacility'
    ListOfGroupsResponse:
      description: returns List<Group>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Group'
    VoidResponse:
      description: returns nothing
    HostResponse:
      description: returns Host
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Host'
    IntegerResponse:
      description: returns Integer
      content:
        application/json:
          schema:
            type: integer
    ListOfFacilitiesWithAttributesResponse:
      description: returns List<FacilityWithAttributes>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/FacilityWithAttributes'
    ExceptionResponse:
      description: exception occurred
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PerunException'
    ListOfRichResourcesResponse:
      description: returns List<RichResource>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/RichResource'
    ListOfRichGroupsResponse:
      description: returns List<RichGroup>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/RichGroup'
    ListOfOwnersResponse:
      description: returns List<Owner>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Owner'
    BanOnFacilityResponse:
      description: returns banOnFacility
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BanOnFacility'
    ListOfEnrichedFacilitiesResponse:
      description: returns List<EnrichedFacility>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/EnrichedFacility'
    ListOfEnrichedHostsResponse:
      description: ' returns List<EnrichedHost>'
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/EnrichedHost'
    ListOfHostsResponse:
      description: returns List<Host>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Host'
    FacilityResponse:
      description: returns Facility
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Facility'
    ListOfResourcesResponse:
      description: returns List<Resource>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Resource'
    ListOfVosResponse:
      description: returns List<Vo>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Vo'
  securitySchemes:
    BasicAuth:
      description: HTTP Basic authentication with username and password
      type: http
      scheme: basic
    BearerAuth:
      description: 'OAuth2 Resource Server authentication using access token in ''Authorization: Bearer'' HTTP header'
      type: http
      scheme: bearer
