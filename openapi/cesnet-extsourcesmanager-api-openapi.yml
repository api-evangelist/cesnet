components:
  responses:
    ListOfExtSourcesResponse:
      description: returns List<ExtSource>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ExtSource'
    ExtSourceResponse:
      description: returns ExtSource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExtSource'
    VoidResponse:
      description: returns nothing
    ExceptionResponse:
      description: exception occurred
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PerunException'
  parameters:
    sourceId:
      name: source
      description: external source id
      schema:
        type: integer
      in: query
      required: true
    voId:
      name: vo
      description: id of Vo
      schema:
        type: integer
      in: query
      required: true
    extSourceIds:
      name: extSources[]
      description: list of extSource ids List<Integer>
      in: query
      required: true
      schema:
        type: array
        items:
          type: integer
    id:
      name: id
      description: numeric id
      schema:
        type: integer
      in: query
      required: true
    groupId:
      name: group
      description: id of Group
      schema:
        type: integer
      in: query
      required: true
    name:
      name: name
      description: name of entity
      schema:
        type: string
      in: query
      required: true
  schemas:
    ExtSource:
      description: represents external source of data for users such as an IdP or an HR database
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        name:
          type: string
        type:
          type: string
    PerunBean:
      description: identifiable entity in Perun, common ancestor of all entity classes
      type: object
      properties:
        id:
          type: integer
        beanName:
          type: string
      required:
      - id
      - beanName
      discriminator:
        propertyName: beanName
    Auditable:
      description: represents audit information
      allOf:
      - $ref: '#/components/schemas/PerunBean'
      properties:
        createdAt:
          type:
          - string
          - 'null'
        createdBy:
          type:
          - string
          - 'null'
        modifiedAt:
          type:
          - string
          - 'null'
        modifiedBy:
          type:
          - string
          - 'null'
        createdByUid:
          type:
          - integer
          - 'null'
        modifiedByUid:
          type:
          - integer
          - 'null'
    PerunException:
      description: exception thrown from inside of Perun
      type: object
      properties:
        errorId:
          type: string
        name:
          type: string
        message:
          type: string
  securitySchemes:
    BasicAuth:
      description: HTTP Basic authentication with username and password
      type: http
      scheme: basic
    BearerAuth:
      description: 'OAuth2 Resource Server authentication using access token in ''Authorization: Bearer'' HTTP header'
      type: http
      scheme: bearer
