components:
  parameters:
    attrNamesOptional:
      name: attrNames[]
      description: list of attribute names List<String> or null
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
    userId:
      name: user
      description: id of User
      schema:
        type: integer
      in: query
      required: true
    voId:
      name: vo
      description: id of Vo
      schema:
        type: integer
      in: query
      required: true
    forceDelete:
      name: force
      description: If true, delete entity forcefully.
      schema:
        type: boolean
      in: query
      required: false
    ids:
      name: ids[]
      description: list of ids List<Integer>
      in: query
      required: true
      schema:
        type: array
        items:
          type: integer
    operandGroupId:
      name: operandGroup
      description: id of Group to have removed 'resultGroup' from subgroups
      schema:
        type: integer
      in: query
      required: true
    attrNames:
      name: attrNames
      description: list of attribute names List<String>
      in: query
      required: true
      schema:
        type: array
        items:
          type: string
    memberId:
      name: member
      description: id of Member
      schema:
        type: integer
      in: query
      required: true
    groupUuid:
      name: uuid
      description: uuid of Group
      schema:
        type: string
        format: uuid
      in: query
      required: true
    groupId:
      name: group
      description: id of Group
      schema:
        type: integer
      in: query
      required: true
    memberIds:
      name: members[]
      description: id of Member
      schema:
        type: array
        items:
          type: integer
      in: query
      required: true
    groupDescription:
      name: description
      description: description of Group
      schema:
        type: string
      in: query
      required: true
    groupName:
      name: name
      description: name of Group
      schema:
        type: string
      in: query
      required: true
    memberVoId:
      name: memberVo
      description: id of member Vo
      schema:
        type: integer
      in: query
      required: true
    resultGroupId:
      name: resultGroup
      description: id of Group to have removed 'operandGroup' from subgroups
      schema:
        type: integer
      in: query
      required: true
    operandGroupIds:
      name: operandGroups[]
      description: IDs of Groups to be removed from 'resultGroup' subgroups
      schema:
        type: array
        items:
          type: integer
      in: query
      required: true
    id:
      name: id
      description: numeric id
      schema:
        type: integer
      in: query
      required: true
    groupIds:
      name: groups[]
      description: list of Group ids List<Integer>
      in: query
      required: true
      schema:
        type: array
        items:
          type: integer
    name:
      name: name
      description: name of entity
