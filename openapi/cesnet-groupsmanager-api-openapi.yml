          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: InputDeleteGroups
              description: input to deleteGroup
              type: object
              required:
              - groups
              - forceDelete
              properties:
                groups:
                  type: array
                  items:
                    type: integer
                forceDelete:
                  type: boolean
                  description: boolean for force delete
