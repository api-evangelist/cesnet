          application/json:
            schema:
              title: InputInviteToGroupFromCsv
              description: input to inviteToGroupFromCsv
              type: object
              required:
              - vo
              - group
              - invitationData
              - language
              - expiration
              properties:
                vo:
                  type: integer
                  description: vo id
                group:
                  type: integer
                  description: group id
                invitationData:
                  type: array
                  items:
                    type: string
                  description: values separated with semicolons
                language:
                  type: string
                  description: language
                expiration:
                  type:
                  - string
                  - 'null'
                  description: 'Date in format yyyy-MM-dd '
