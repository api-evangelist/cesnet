  /urlinjsonout/invitationsManager/inviteToGroup:
    post:
      tags:
      - InvitationsManager
      operationId: inviteToGroup
      summary: Creates invitation to group and sends the link via email.
      parameters:
      - $ref: '#/components/parameters/voId'
      - $ref: '#/components/parameters/groupId'
      - name: receiverName
        description: Name of the invited user
        schema:
          type: string
        in: query
        required: true
      - name: receiverEmail
        description: Email of the invited user
        schema:
          type: string
          format: string
        in: query
        required: true
      - name: language
        description: Language of the invitation, should match available instance locales
        schema:
          type: string
        in: query
        required: true
      - name: expiration
        description: Expiration date of the invite in format yyyy-MM-dd}
        schema:
          type: string
        in: query
        required: false
      - name: redirectUrl
        description: URL to redirect to after application filled out.
        schema:
          type: string
        in: query
        required: false
      responses:
        '200':
          $ref: '#/components/responses/InvitationResponse'
        default:
