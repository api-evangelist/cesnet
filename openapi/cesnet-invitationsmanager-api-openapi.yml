components:
  parameters:
    voId:
      name: vo
      description: id of Vo
      schema:
        type: integer
      in: query
      required: true
    invitationUuid:
      name: uuid
      description: uuid of Invitation
      schema:
        type: string
        format: uuid
      in: query
      required: true
    groupId:
      name: group
      description: id of Group
      schema:
        type: integer
      in: query
      required: true
    applicationId:
      name: appId
      description: id of application
      schema:
        type: integer
      in: query
      required: true
    invitationId:
      name: invitation
      description: id of Invitation
      schema:
        type: integer
      in: query
      required: true
  schemas:
    PerunBean:
      description: identifiable entity in Perun, common ancestor of all entity classes
      type: object
      properties:
        id:
          type: integer
        beanName:
          type: string
      required:
      - id
      - beanName
      discriminator:
        propertyName: beanName
    Invitation:
      type: object
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        voId:
          type: integer
        groupId:
          type: integer
        applicationId:
          type:
          - integer
          - 'null'
        senderId:
          type: integer
        receiverName:
          type: string
        receiverEmail:
          type: string
          format: email
        redirectUrl:
          type:
          - string
          - 'null'
        token:
          type:
          - string
          - 'null'
          format: uuid
        language:
          type: string
        expiration:
          type: string
        status:
          $ref: '#/components/schemas/InvitationStatus'
    InvitationsPageQuery:
      properties:
        pageSize:
          type: integer
        offset:
          type: integer
        order:
          $ref: '#/components/schemas/SortingOrder'
        sortColumn:
          $ref: '#/components/schemas/InvitationsOrderColumn'
        searchString:
          type: string
        statuses:
          type: array
          items:
            $ref: '#/components/schemas/InvitationStatus'
        expirationFrom:
          type: string
          format: date
        expirationTo:
          type: string
          format: date
      required:
      - pageSize
      - offset
      - order
      - sortColumn
    InvitationsOrderColumn:
      type: string
      enum:
      - ID
      - STATUS
      - EXPIRATION
      - RECEIVER_NAME
      - RECEIVER_EMAIL
      - SENDER_NAME
    InvitationStatus:
      type: string
      enum:
      - PENDING
      - ACCEPTED
      - EXPIRED
      - REVOKED
      - UNSENT
    PerunException:
      description: exception thrown from inside of Perun
      type: object
      properties:
        errorId:
          type: string
        name:
          type: string
        message:
          type: string
    InvitationWithSender:
      type: object
      allOf:
      - $ref: '#/components/schemas/Invitation'
      properties:
        senderName:
          type: string
        senderEmail:
          type: string
          format: email
    Auditable:
      description: represents audit information
      allOf:
      - $ref: '#/components/schemas/PerunBean'
      properties:
        createdAt:
          type:
          - string
          - 'null'
        createdBy:
          type:
          - string
          - 'null'
        modifiedAt:
          type:
          - string
          - 'null'
        modifiedBy:
          type:
          - string
          - 'null'
        createdByUid:
          type:
          - integer
          - 'null'
        modifiedByUid:
          type:
          - integer
          - 'null'
    SortingOrder:
      type: string
      enum:
      - ASCENDING
      - DESCENDING
    PaginatedInvitationsWithSender:
      properties:
        offset:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/InvitationWithSender'
      required:
      - offset
      - pageSize
      - totalCount
      - data
  responses:
    MapStringStringResponse:
      description: returns Map<String,String>
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              type: string
    InvitationResponse:
      description: returns Invitation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Invitation'
    VoidResponse:
      description: returns nothing
    PaginatedInvitationWithSenderResponse:
      description: returns Paginated<InvitationWithSender>
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaginatedInvitationsWithSender'
    ExceptionResponse:
      description: exception occurred
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PerunException'
    InvitationWithSenderResponse:
      description: returns InvitationWithSender
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvitationWithSender'
  securitySchemes:
    BasicAuth:
      description: HTTP Basic authentication with username and password
      type: http
      scheme: basic
    BearerAuth:
      description: 'OAuth2 Resource Server authentication using access token in ''Authorization: Bearer'' HTTP header'
      type: http
      scheme: bearer
