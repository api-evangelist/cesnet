openapi: 3.2.0
info:
  title: Cesnet Choices API
  version: '3.0'
  description: 'Operations tagged Choices across 2 of this provider''s published API definitions: cesnet-exafs-swagger.yml, cesnet-exafs-openapi.yml. Each path carries the servers of the definition it was published in.'
security:
- TokenAuth: []
tags:
- name: Choices
  description: Choices for rule actions and communities.
paths:
  /actions:
    get:
      tags:
      - Choices
      summary: Get available actions
      description: Returns actions allowed for current user
      responses:
        '200':
          description: List of available actions
        '404':
          description: No actions found for user
      operationId: getActions
      x-operation-id-source: derived
  /communities:
    get:
      tags:
      - Choices
      summary: Get available communities
      description: Returns RTBH communities allowed for current user
      responses:
        '200':
          description: List of available communities
        '404':
          description: No communities found for user
      operationId: getCommunities
      x-operation-id-source: derived
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: API key for initial authentication
    TokenAuth:
      type: apiKey
      in: header
      name: x-access-token
      description: auth token received from /auth endpoint
x-refined-from:
- cesnet-exafs-swagger.yml
- cesnet-exafs-openapi.yml
