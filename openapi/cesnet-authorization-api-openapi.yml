openapi: 3.2.0
info:
  title: Cesnet Authorization API
  version: '3.0'
  description: 'Operations tagged Authorization across 2 of this provider''s published API definitions: cesnet-exafs-swagger.yml, cesnet-exafs-openapi.yml. Each path carries the servers of the definition it was published in.'
security:
- TokenAuth: []
tags:
- name: Authorization
  description: Endpoints for obtaining and managing API tokens.
paths:
  /auth:
    get:
      tags:
      - Authorization
      security:
      - ApiKeyAuth: []
      summary: Authenticate and get JWT token
      description: Generate API Key for the logged user using PyJWT
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT token to be used in subsequent requests
        '401':
          description: Authentication failed - token expired
        '403':
          description: Authentication failed - token invalid
      operationId: getAuth
      x-operation-id-source: derived
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: API key for initial authentication
    TokenAuth:
      type: apiKey
      in: header
      name: x-access-token
      description: auth token received from /auth endpoint
x-refined-from:
- cesnet-exafs-swagger.yml
- cesnet-exafs-openapi.yml
