              - login
              - identifier
              - issuer
              - namespace
              properties:
                login:
                  type: string
                identifier:
                  type: string
                issuer:
                  type: string
                namespace:
                  type: string
                password:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/usersManager/deleteReservedLogin:
    post:
      tags:
      - UsersManager
      operationId: deleteReservedLogin
      summary: Deletes login reservation for given namespace and login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - login
              properties:
                namespace:
                  type: string
                login:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
components:
  schemas:
    RichResource:
      allOf:
      - $ref: '#/components/schemas/Resource'
      properties:
        vo:
          $ref: '#/components/schemas/Vo'
        facility:
          $ref: '#/components/schemas/Facility'
        resourceTags:
          type: array
          items:
            $ref: '#/components/schemas/ResourceTag'
    PaginatedRichUsers:
      description: represents Paginated&lt;RichUser>
      properties:
        offset:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/RichUser'
      required:
      - offset
      - pageSize
      - totalCount
      - data
    ExtSource:
      description: represents external source of data for users such as an IdP or an HR database
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        name:
          type: string
        type:
          type: string
    Candidate:
      allOf:
      - $ref: '#/components/schemas/User'
      properties:
        userExtSource:
          $ref: '#/components/schemas/UserExtSource'
        additionalUserExtSources:
          type: array
          items:
            $ref: '#/components/schemas/UserExtSource'
        attributes:
          type: object
          additionalProperties:
            type: string
        expectedSyncGroupStatus:
          type: string
    PerunException:
      description: exception thrown from inside of Perun
      type: object
      properties:
        errorId:
          type: string
        name:
          type: string
        message:
          type: string
    AttributeDefinition:
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        friendlyName:
          type: string
        namespace:
          type: string
        description:
          type:
          - string
          - 'null'
        type:
          type: string
        displayName:
          type: string
        writable:
          type: boolean
        unique:
          type: boolean
        friendlyNameParameter:
          type: string
          readOnly: true
        baseFriendlyName:
          type: string
          readOnly: true
        entity:
          type: string
          readOnly: true
    PerunBean:
      description: identifiable entity in Perun, common ancestor of all entity classes
      type: object
      properties:
        id:
          type: integer
        beanName:
          type: string
      required:
      - id
      - beanName
      discriminator:
        propertyName: beanName
    Resource:
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        name:
          type: string
        description:
          type: string
        voId:
          type: integer
        facilityId:
          type: integer
        uuid:
          type: string
          format: uuid
    RichUser:
      description: user data packed together with all user attributes and UserExtSources
      allOf:
      - $ref: '#/components/schemas/User'
      properties:
        userExtSources:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/UserExtSource'
        userAttributes:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Attribute'
      required:
      - userExtSources
      - userAttributes
    RichUserExtSource:
      properties:
        userExtSource:
          $ref: '#/components/schemas/UserExtSource'
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/Attribute'
      required:
      - userExtSource
      - attributes
    Attribute:
      allOf:
      - $ref: '#/components/schemas/AttributeDefinition'
      properties:
        valueCreatedAt:
          type:
          - string
          - 'null'
        valueCreatedBy:
          type:
          - string
          - 'null'
        valueModifiedAt:
          type:
          - string
          - 'null'
        valueModifiedBy:
          type:
          - string
          - 'null'
        value: {}
    PaginatedBlockedLogins:
      properties:
        offset:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/BlockedLogin'
      required:
      - offset
      - pageSize
      - totalCount
      - data
    UsersOrderColumn:
      type: string
      enum:
      - ID
      - NAME
    Sponsor:
      description: represents a Sponsor for some specific member
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        userExtSources:
          type: array
          items:
            $ref: '#/components/schemas/UserExtSource'
        userAttributes:
          type: array
          items:
            $ref: '#/components/schemas/Attribute'
        validityTo:
          type: string
          description: Date in format yyyy-MM-dd}
        active:
          type: boolean
      required:
      - user
      - userExtSources
      - userAttributes
      - validityTo
      - active
    RichGroup:
      allOf:
      - $ref: '#/components/schemas/Group'
      properties:
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/Attribute'
    Facility:
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        uuid:
          type: string
          format: uuid
    UserExtSource:
      description: represents specific user authentication or identification in external source of data
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        login:
          type: string
        userId:
          type: integer
        loa:
          type: integer
        persistent:
          type: boolean
        lastAccess:
          type: string
          format: timestamp
          description: SQL timestamp
          example: '2012-01-01 00:00:00.100000'
        extSource:
          $ref: '#/components/schemas/ExtSource'
      required:
      - login
      - extSource
    Vo:
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        name:
          type: string
        shortName:
          type: string
        uuid:
          type: string
          format: uuid
    Group:
      allOf:
      - $ref: '#/components/schemas/Auditable'
      type:
      - object
      - 'null'
      properties:
        name:
          type: string
        shortName:
          type: string
        description:
          type:
          - string
          - 'null'
        voId:
          type: integer
        parentGroupId:
          type:
          - integer
          - 'null'
        uuid:
          type: string
          format: uuid
    SortingOrder:
      type: string
      enum:
      - ASCENDING
      - DESCENDING
    BlockedLogin:
      description: represent a login block for namespace (or globally)
      properties:
        id:
          type: integer
        login:
          type: string
        namespace:
          type: string
    User:
      description: represents user as a physical person
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        firstName:
          type:
          - string
          - 'null'
        lastName:
          type:
          - string
          - 'null'
        middleName:
          type:
          - string
          - 'null'
        titleBefore:
          type:
          - string
          - 'null'
        titleAfter:
          type:
          - string
          - 'null'
        serviceUser:
          type: boolean
        sponsoredUser:
          type: boolean
        uuid:
          type: string
          format: uuid
        specificUser:
          type: boolean
        majorSpecificType:
          type: string
    BlockedLoginsOrderColumn:
      type: string
      enum:
      - LOGIN
      - NAMESPACE
    UsersPageQuery:
      properties:
        pageSize:
          type: integer
        offset:
          type: integer
        order:
          $ref: '#/components/schemas/SortingOrder'
        sortColumn:
          $ref: '#/components/schemas/UsersOrderColumn'
        searchString:
          type: string
        withoutVo:
          type: boolean
        facilityId:
          type: integer
        voId:
          type: integer
        serviceId:
          type: integer
        resourceId:
          type: integer
        onlyAllowed:
          type: boolean
        consentStatuses:
          type: array
          items:
            $ref: '#/components/schemas/ConsentStatus'
      required:
      - pageSize
      - offset
      - order
      - sortColumn
    ConsentStatus:
      type: string
      description: statuses of consents
      enum:
      - UNSIGNED
      - GRANTED
      - REVOKED
    BlockedLoginsPageQuery:
      properties:
        pageSize:
          type: integer
        offset:
          type: integer
        order:
          $ref: '#/components/schemas/SortingOrder'
        sortColumn:
          $ref: '#/components/schemas/BlockedLoginsOrderColumn'
        namespaces:
          type: array
          items:
            type: string
        searchString:
          type: string
      required:
      - pageSize
      - offset
      - order
      - sortColumn
    Auditable:
      description: represents audit information
      allOf:
      - $ref: '#/components/schemas/PerunBean'
      properties:
        createdAt:
          type:
          - string
          - 'null'
        createdBy:
          type:
          - string
          - 'null'
        modifiedAt:
          type:
          - string
          - 'null'
        modifiedBy:
          type:
          - string
          - 'null'
        createdByUid:
          type:
          - integer
          - 'null'
        modifiedByUid:
          type:
          - integer
          - 'null'
    ResourceTag:
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        tagName:
          type: string
        voId:
          type: integer
  parameters:
    attrNames:
      name: attrNames
      description: list of attribute names List<String>
      in: query
      required: true
      schema:
        type: array
        items:
          type: string
    forceDelete:
      name: force
      description: If true, delete entity forcefully.
      schema:
        type: boolean
      in: query
      required: false
    memberId:
      name: member
      description: id of Member
      schema:
        type: integer
      in: query
      required: true
    attributeValue:
      name: attributeValue
      description: string value of Attribute
      schema:
        type: string
      in: query
      required: true
    specificUserId:
      name: specificUser
      description: id of specific User
      schema:
        type: integer
      in: query
      required: true
    resourceId:
      name: resource
      description: id of Resource
      schema:
        type: integer
      in: query
      required: true
    attrNamesOptional:
      name: attrNames[]
      description: list of attribute names List<String> or null
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
    ids:
      name: ids[]
      description: list of ids List<Integer>
      in: query
      required: true
      schema:
        type: array
        items:
          type: integer
    id:
      name: id
      description: numeric id
      schema:
        type: integer
      in: query
      required: true
    userExtSourceId:
      name: userExtSource
      description: id of UserExtSource
      schema:
        type: integer
      in: query
      required: true
    voId:
      name: vo
      description: id of Vo
      schema:
        type: integer
      in: query
      required: true
    login:
      name: login
      description: login
      schema:
        type: string
      in: query
      required: true
    searchString:
      name: searchString
      description: Text to search by
      schema:
        type: string
      in: query
      required: true
    attributeId:
      name: attributeId
      description: id of AttributeDefinition
      schema:
        type: integer
      in: query
      required: true
    namespace:
      name: namespace
      description: namespace
      schema:
        type: string
      in: query
      required: true
    userId:
      name: user
      description: id of User
      schema:
        type: integer
      in: query
      required: true
    extLogin:
      name: extLogin
      description: external login of user, e.g. john
      schema:
        type: string
      in: query
      required: true
    facilityId:
      name: facility
      description: id of Facility
      schema:
        type: integer
      in: query
      required: true
    extSourceName:
      name: extSourceName
      description: external source name, e.g. IdP entityId
      schema:
        type: string
      in: query
      required: true
    attributeName:
      name: attributeName
      description: full name of attribute definition (namespace + ':' + friendlyName)
      schema:
        type: string
      in: query
      required: true
  responses:
    RichUserExtSourceResponse:
      description: returns richUserExtSource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RichUserExtSource'
    StringResponse:
      description: returns String
      content:
        application/json:
          schema:
            type: string
    MapStringStringResponse:
      description: returns Map<String,String>
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              type: string
    ListOfUsersResponse:
      description: returns List<User>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/User'
    UserResponse:
      description: returns User
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/User'
    RichUserResponse:
      description: returns RichUser
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RichUser'
    ListOfGroupsResponse:
      description: returns List<Group>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Group'
    VoidResponse:
      description: returns nothing
    PaginatedRichUsersResponse:
      description: returns Paginated<RichUser>
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaginatedRichUsers'
    IntegerResponse:
      description: returns Integer
      content:
        application/json:
          schema:
            type: integer
    ExceptionResponse:
      description: exception occurred
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PerunException'
    ListOfRichResourcesResponse:
      description: returns List<RichResource>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/RichResource'
    ListOfRichGroupsResponse:
      description: returns List<RichGroup>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/RichGroup'
    ListOfRichUserExtSourcesResponse:
      description: returns List<RichUserExtSource>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/RichUserExtSource'
    ListOfRichUsersResponse:
      description: returns List<RichUser>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/RichUser'
    UserExtSourceResponse:
      description: returns userExtSource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserExtSource'
    MapStringListOfPerunBeanResponse:
      description: returns Map<String,List<PerunBean>>
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/PerunBean'
    PaginatedBlockedLoginsResponse:
      description: returns Paginated<BlockedLogin>
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaginatedBlockedLogins'
    BooleanResponse:
      description: returns Boolean
      content:
        application/json:
          schema:
            type: boolean
    ListOfStringsResponse:
      description: returns List<String>
      content:
        application/json:
          schema:
            type: array
            items:
              type: string
    ListOfResourcesResponse:
      description: returns List<Resource>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Resource'
    ListOfSponsorsResponse:
      description: returns List<Sponsor>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Sponsor'
    ListOfUserExtSourcesResponse:
      description: returns List<UserExtSource>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/UserExtSource'
    ListOfVosResponse:
      description: returns List<Vo>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Vo'
  securitySchemes:
    BasicAuth:
      description: HTTP Basic authentication with username and password
      type: http
      scheme: basic
    BearerAuth:
      description: 'OAuth2 Resource Server authentication using access token in ''Authorization: Bearer'' HTTP header'
      type: http
      scheme: bearer
