openapi: 3.2.0
info:
  version: 0.0.0
  title: Perun RPC Users Manager API
  description: Perun Remote Procedure Calls Application Programming Interface
  contact:
    url: https://perun-aai.org
    email: perun@cesnet.cz
servers:
- url: https://{server}/{authentication}/rpc
  description: Perun RPC server
  variables:
    server:
      default: api-dev.perun-aai.org
      description: DNS name of a Perun server
    authentication:
      default: ba
      description: 'way of authentication:

        ba - HTTP Basic Auth

        krb - Kerberos

        non - no authentication

        cert - X509 client certificate

        oauth - OAuth 2.0 bearer access token

        fed - SAML federation

        '
      enum:
      - ba
      - krb
      - non
      - cert
      - oauth
      - fed
security:
- BasicAuth: []
- BearerAuth: []
tags:
- name: UsersManager
  description: UsersManager RPC API in Perun
  externalDocs:
    url: https://perun-aai.org/documentation/technical-documentation/rpc-api/rpc-javadoc-UsersManager.html
paths:
  /json/usersManager/getUserById:
    get:
      tags:
      - UsersManager
      operationId: getUserById
      summary: Returns user by its id
      description: Returns object representing the User
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/usersManager/getSponsorsForMember/member:
    get:
      tags:
      - UsersManager
      operationId: getSponsorsForMember
      summary: Gets sponsors for given member with optional attribute names
      parameters:
      - $ref: '#/components/parameters/memberId'
      - $ref: '#/components/parameters/attrNamesOptional'
      responses:
        '200':
          $ref: '#/components/responses/ListOfSponsorsResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/usersManager/getSponsorsForMember/vo:
    get:
      tags:
      - UsersManager
      operationId: getSponsorsForMemberByVoAndLogin
      summary: Gets sponsors for member specified by VO, extSourceName and extLogin with…
      parameters:
      - $ref: '#/components/parameters/voId'
      - $ref: '#/components/parameters/extSourceName'
      - $ref: '#/components/parameters/extLogin'
      - $ref: '#/components/parameters/attrNamesOptional'
      responses:
        '200':
          $ref: '#/components/responses/ListOfSponsorsResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/usersManager/getUserByExtSourceNameAndExtLogin:
    get:
      tags:
      - UsersManager
      operationId: getUserByExtSourceNameAndExtLogin
      summary: Returns user by its ExtSourceName and ExtLogin
      description: Returns User found by its authentication data
      parameters:
      - $ref: '#/components/parameters/extLogin'
      - $ref: '#/components/parameters/extSourceName'
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/usersManager/getRichUserWithAttributes:
    get:
      tags:
      - UsersManager
      operationId: getRichUserWithAttributes
      summary: Returns user with attributes
      description: Returns object representing the User with attributes
      parameters:
      - $ref: '#/components/parameters/userId'
      responses:
        '200':
          $ref: '#/components/responses/RichUserResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/usersManager/getUsers:
    get:
      tags:
      - UsersManager
      operationId: getUsers
      summary: Returns all users
      description: Returns list of objects representing the User
      responses:
        '200':
          $ref: '#/components/responses/ListOfUsersResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/usersManager/getAllRichUsersWithAttributes:
    get:
      tags:
      - UsersManager
      operationId: getAllRichUsersWithAttributes
      summary: Returns users with attributes
      description: Returns list of objects representing the User with attributes
      parameters:
      - name: includedSpecificUsers
        description: if you want to or don't want to get specificUsers too
        schema:
          type: boolean
        in: query
        required: true
      responses:
        '200':
          $ref: '#/components/responses/ListOfRichUsersResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/usersManager/getRichUsersByIds:
    get:
      tags:
      - UsersManager
      operationId: getRichUsersByIds
      summary: Returns rich users without attributes by their IDs
      parameters:
      - $ref: '#/components/parameters/ids'
      responses:
        '200':
          $ref: '#/components/responses/ListOfRichUsersResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/usersManager/getRichUsersWithAttributesByIds:
    get:
      tags:
      - UsersManager
      operationId: getRichUsersWithAttributesByIds
      summary: Returns rich users with attributes by their IDs
      parameters:
      - $ref: '#/components/parameters/ids'
      responses:
        '200':
          $ref: '#/components/responses/ListOfRichUsersResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/usersManager/getUserExtSources:
    get:
      tags:
      - UsersManager
      operationId: getUserExtSources
      summary: Gets list of all user's external sources
      parameters:
      - $ref: '#/components/parameters/userId'
      responses:
        '200':
          $ref: '#/components/responses/ListOfUserExtSourcesResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/usersManager/checkPasswordStrength:
    post:
      tags:
      - UsersManager
      operationId: checkPasswordStrength
      summary: Check password strength for the given namespace.
      description: If the check fails, the PasswordStrengthException error is returned.
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: InputCheckPasswordStrength
              description: input for checkPasswordStrength
              type: object
              required:
              - password
              - namespace
              properties:
                password:
                  type: string
                namespace:
                  type: string
                login:
                  type: string
  /json/usersManager/getGroupsWhereUserIsActive/facility:
    get:
      tags:
      - UsersManager
      operationId: getGroupsForFacilityWhereUserIsActive
      summary: Get list of groups of user on specified facility where use is active
      description: That means User is a VALID in the VO and the Group and groups are assigned to the facility.
      parameters:
      - $ref: '#/components/parameters/userId'
      - $ref: '#/components/parameters/facilityId'
      responses:
        '200':
          $ref: '#/components/responses/ListOfGroupsResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/usersManager/getGroupsWhereUserIsActive/resource:
    get:
      tags:
      - UsersManager
      operationId: getGroupsForResourceWhereUserIsActive
      summary: Get list of groups of user on specified resource where use is active
      description: That means User is a VALID in the VO and the Group and groups are assigned to the resource.
      parameters:
      - $ref: '#/components/parameters/userId'
      - $ref: '#/components/parameters/resourceId'
      responses:
        '200':
          $ref: '#/components/responses/ListOfGroupsResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/usersManager/getRichGroupsWhereUserIsActive/facility:
    get:
      tags:
      - UsersManager
      operationId: getRichGroupsForFacilityWhereUserIsActive
      summary: Get list of groups of user on specified facility where use is active
      description: That means User is a VALID in the VO and the Group and groups are assigned to the facility.
      parameters:
      - $ref: '#/components/parameters/userId'
      - $ref: '#/components/parameters/facilityId'
      - $ref: '#/components/parameters/attrNames'
      responses:
        '200':
          $ref: '#/components/responses/ListOfRichGroupsResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/usersManager/getRichGroupsWhereUserIsActive/resource:
    get:
      tags:
      - UsersManager
      operationId: getRichGroupsForResourceWhereUserIsActive
      summary: Get list of groups of user on specified resource where use is active
      description: That means User is a VALID in the VO and the Group and groups are assigned to the resource.
      parameters:
      - $ref: '#/components/parameters/userId'
      - $ref: '#/components/parameters/resourceId'
      - $ref: '#/components/parameters/attrNames'
      responses:
        '200':
          $ref: '#/components/responses/ListOfRichGroupsResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/usersManager/findUsers:
    get:
      tags:
      - UsersManager
      operationId: findUsers
      summary: Returns list of Users with attributes who matches the searchString, searching…
      parameters:
      - $ref: '#/components/parameters/searchString'
      responses:
        '200':
          $ref: '#/components/responses/ListOfUsersResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/usersManager/findRichUsers:
    get:
      tags:
      - UsersManager
      operationId: findRichUsers
      summary: Returns list of RichUsers with attributes who matches the searchString…
      parameters:
      - $ref: '#/components/parameters/searchString'
      responses:
        '200':
          $ref: '#/components/responses/ListOfRichUsersResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/usersManager/findRichUsersWithAttributes:
    get:
      tags:
      - UsersManager
      operationId: findRichUsersWithAttributes
      summary: Returns list of RichUsers with attributes who matches the searchString
      parameters:
      - $ref: '#/components/parameters/searchString'
      - name: attrsNames[]
        description: list of attribute names List<String> or null
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/ListOfRichUsersResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/usersManager/getRichUsersWithoutVoWithAttributes:
    get:
      tags:
      - UsersManager
      operationId: getRichUsersWithoutVoWithAttributes
      summary: Returns list of RichUsers which are not members of any VO with attributes
      parameters:
      - name: attrsNames[]
        description: list of attribute names List<String> or null
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/ListOfRichUsersResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/usersManager/getVosWhereUserIsMember:
    get:
      tags:
      - UsersManager
      operationId: getVosWhereUserIsMember
      summary: Returns list of VOs, where the user is a Member
      parameters:
      - $ref: '#/components/parameters/userId'
      responses:
        '200':
          $ref: '#/components/responses/ListOfVosResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/usersManager/getVosWhereUserIsAdmin:
    get:
      tags:
      - UsersManager
      operationId: getVosWhereUserIsAdmin
      summary: Returns list of VOs, where the user is an Administrator.
      parameters:
      - $ref: '#/components/parameters/userId'
      responses:
        '200':
          $ref: '#/components/responses/ListOfVosResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/usersManager/getGroupsWhereUserIsAdmin/u:
    get:
      tags:
      - UsersManager
      operationId: getGroupsWhereUserIsAdmin
      summary: Returns list of Groups in Perun, where the User is a direct Administrator or he…
      parameters:
      - $ref: '#/components/parameters/userId'
      responses:
        '200':
          $ref: '#/components/responses/ListOfGroupsResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/usersManager/getGroupsWhereUserIsAdmin/u-v:
    get:
      tags:
      - UsersManager
      operationId: getGroupsInVoWhereUserIsAdmin
      summary: Returns list of Groups in selected Vo, where the User is a direct Administrator…
      parameters:
      - $ref: '#/components/parameters/userId'
      - $ref: '#/components/parameters/voId'
      responses:
        '200':
          $ref: '#/components/responses/ListOfGroupsResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/usersManager/getRichUserExtSources/u:
    get:
      tags:
      - UsersManager
      operationId: getRichUserExtSources
      summary: Gets list of all user's external sources with attributes
      parameters:
      - $ref: '#/components/parameters/userId'
      responses:
        '200':
          $ref: '#/components/responses/ListOfRichUserExtSourcesResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/usersManager/createAlternativePassword:
    post:
      tags:
      - UsersManager
      operationId: createAlternativePassword
      summary: Creates alternative password in external system
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: InputCreateAlternativePassword
              description: input for createAlternativePassword
              type: object
              required:
              - user
              - description
              - loginNamespace
              - password
              properties:
                user:
                  type: integer
                description:
                  type: string
                loginNamespace:
                  type: string
                password:
                  type: string
  /json/usersManager/deleteAlternativePassword:
    post:
      tags:
      - UsersManager
      operationId: deleteAlternativePassword
      summary: Deletes alternative password in external system
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: InputDeleteAlternativePassword
              description: input for deleteAlternativePassword
              type: object
              required:
              - user
              - passwordId
              - loginNamespace
              properties:
                user:
                  type: string
                passwordId:
                  type: string
                loginNamespace:
                  type: string
  /urlinjsonout/usersManager/updateUserExtSourceLastAccess:
    post:
      tags:
      - UsersManager
      operationId: updateUserExtSourceLastAccess
      summary: Updates user's userExtSource last access time in DB.
      parameters:
      - $ref: '#/components/parameters/userExtSourceId'
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /urlinjsonout/usersManager/removeUserExtSource:
    post:
      tags:
      - UsersManager
      operationId: removeUserExtSource
      summary: Remove user's external source.
      parameters:
      - $ref: '#/components/parameters/userId'
      - $ref: '#/components/parameters/userExtSourceId'
      - $ref: '#/components/parameters/forceDelete'
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /urlinjsonout/usersManager/removeUserExtSources:
    post:
      tags:
      - UsersManager
      operationId: removeUserExtSources
      summary: Remove user's external sources.
      parameters:
      - $ref: '#/components/parameters/userId'
      - name: userExtSources
        description: list of userExtSource ids
        schema:
          type: array
          items:
            type: integer
        in: query
        required: true
      - $ref: '#/components/parameters/forceDelete'
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/usersManager/getUserExtSourceById:
    get:
      tags:
      - UsersManager
      operationId: getUserExtSourceById
      summary: Returns user ext source by its id
      parameters:
      - $ref: '#/components/parameters/userExtSourceId'
      responses:
        '200':
          $ref: '#/components/responses/UserExtSourceResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/usersManager/getUserExtSourceByExtLoginAndExtSourceName:
    get:
      tags:
      - UsersManager
      operationId: getUserExtSourceByExtLoginAndExtSourceName
      summary: Returns user's external source by the user's external login and external source…
      parameters:
      - $ref: '#/components/parameters/extSourceName'
      - name: extSourceLogin
        description: external source login
        schema:
          type: string
        in: query
        required: true
      responses:
        '200':
          $ref: '#/components/responses/UserExtSourceResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/usersManager/getUserExtSourcesByIds:
    get:
      tags:
      - UsersManager
      operationId: getUserExtSourcesByIds
      summary: Returns list of user ext sources by their ids
      parameters:
      - $ref: '#/components/parameters/ids'
      responses:
        '200':
          $ref: '#/components/responses/ListOfUserExtSourcesResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/usersManager/getUserExtSourceByUniqueAttributeValue/id:
    get:
      tags:
      - UsersManager
      operationId: getUserExtSourceByUniqueAttributeValueAndAttributeId
      summary: Return userExtSource for specific attribute definition (specified by id) and…
      parameters:
      - $ref: '#/components/parameters/attributeId'
      - $ref: '#/components/parameters/attributeValue'
      responses:
        '200':
          $ref: '#/components/responses/UserExtSourceResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/usersManager/getUserExtSourceByUniqueAttributeValue/name:
    get:
      tags:
      - UsersManager
      operationId: getUserExtSourceByUniqueAttributeValueAndAttributeName
      summary: Return userExtSource for specific attribute definition (specified by name) and…
      parameters:
      - $ref: '#/components/parameters/attributeName'
      - $ref: '#/components/parameters/attributeValue'
      responses:
        '200':
          $ref: '#/components/responses/UserExtSourceResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /urlinjsonout/usersManager/requestPreferredEmailChange:
    post:
      tags:
      - UsersManager
      operationId: requestPreferredEmailChange
      summary: Request to change preferred email address of user.
      parameters:
      - $ref: '#/components/parameters/userId'
      - name: email
        description: new email address to set
        schema:
          type: string
        in: query
        required: true
      - name: lang
        description: language to get confirmation mail in (optional)
        schema:
          type: string
        in: query
        required: false
      - name: linkPath
        description: path that is appended to the referer and creates the verification link (optional)
        schema:
          type: string
        in: query
        required: false
      - name: customUrl
        description: url to verification link containing path (optional)
        schema:
          type: string
        in: query
        required: false
      - name: idpFilter
        description: authentication method appended to query parameters of verification link (optional)
        schema:
          type: string
        in: query
        required: false
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/usersManager/addUserExtSource:
    post:
      tags:
      - UsersManager
      operationId: addUserExtSource
      summary: Adds user's external sources
      responses:
        '200':
          $ref: '#/components/responses/UserExtSourceResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: AddUserExtSourceInput
              description: input to addUserExtSource
              type: object
              required:
              - user
              - userExtSource
              properties:
                user:
                  type: integer
                userExtSource:
                  $ref: '#/components/schemas/UserExtSource'
  /json/usersManager/addUserExtSourceWithAttributes:
    post:
      tags:
      - UsersManager
      operationId: addUserExtSourceWithAttributes
      summary: Adds user's external source along with the given attributes
      responses:
        '200':
          $ref: '#/components/responses/RichUserExtSourceResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: AddUserExtSourceWithAttributesInput
              description: input to addUserExtSourceWithAttributes
              type: object
              required:
              - user
              - userExtSource
              - attributes
              properties:
                user:
                  type: integer
                userExtSource:
                  $ref: '#/components/schemas/UserExtSource'
                attributes:
                  type: array
                  items:
                    $ref: '#/components/schemas/Attribute'
  /json/usersManager/validatePreferredEmailChange:
    post:
      tags:
      - UsersManager
      operationId: validatePreferredEmailChangeWithToken
      summary: Validate new preferred email address.
      responses:
        '200':
          $ref: '#/components/responses/StringResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: InputValidatePreferredEmailChange
              description: input for validatePreferredEmailChange
              type: object
              required:
              - token
              - u
              properties:
                token:
                  type: string
                  format: uuid
                u:
                  type: integer
  /json/usersManager/getPendingPreferredEmailChanges:
    get:
      tags:
      - UsersManager
      operationId: getPendingPreferredEmailChanges
      summary: Return list of email addresses of user, which are awaiting validation and are…
      parameters:
      - $ref: '#/components/parameters/userId'
      responses:
        '200':
          $ref: '#/components/responses/ListOfStringsResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/usersManager/getAssignedRichResources:
    get:
      tags:
      - UsersManager
      operationId: getAssignedRichResourcesForUser
      summary: Get all rich resources where the user is assigned.
      parameters:
      - $ref: '#/components/parameters/userId'
      responses:
        '200':
          $ref: '#/components/responses/ListOfRichResourcesResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/usersManager/getAssociatedResources:
    get:
      tags:
      - UsersManager
      operationId: getAssociatedResourcesForUser
      summary: Get all resources associated with the user on the facility
      parameters:
      - $ref: '#/components/parameters/facilityId'
      - $ref: '#/components/parameters/userId'
      responses:
        '200':
          $ref: '#/components/responses/ListOfResourcesResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/usersManager/getUsersByIds:
    get:
      tags:
      - UsersManager
      operationId: getUsersByIds
      summary: Returns list of Users by their ids
      parameters:
      - $ref: '#/components/parameters/ids'
      responses:
        '200':
          $ref: '#/components/responses/ListOfUsersResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/usersManager/getSpecificUsersByUser:
    get:
      tags:
      - UsersManager
      operationId: getSpecificUsersByUser
      summary: Get all specific users who are owned by the user
      parameters:
      - $ref: '#/components/parameters/userId'
      responses:
        '200':
          $ref: '#/components/responses/ListOfUsersResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /urlinjsonout/usersManager/addSpecificUserOwner:
    post:
      tags:
      - UsersManager
      operationId: addSpecificUserOwner
      summary: Add specific user owner
      parameters:
      - $ref: '#/components/parameters/userId'
      - $ref: '#/components/parameters/specificUserId'
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /urlinjsonout/usersManager/moveUserExtSource:
    post:
      tags:
      - UsersManager
      operationId: moveUserExtSource
      summary: Move UserExtSource from one user to another
      parameters:
      - name: sourceUser
        schema:
          type: integer
        in: query
        description: id of source user
        required: true
      - name: targetUser
        schema:
          type: integer
        in: query
        description: id of target user
        required: true
      - $ref: '#/components/parameters/userExtSourceId'
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /urlinjsonout/usersManager/removeSpecificUserOwner:
    post:
      tags:
      - UsersManager
      operationId: removeSpecificUserOwner
      summary: Remove specific user owner
      parameters:
      - $ref: '#/components/parameters/userId'
      - $ref: '#/components/parameters/specificUserId'
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/usersManager/getUsersBySpecificUser:
    get:
      tags:
      - UsersManager
      operationId: getUsersBySpecificUser
      summary: Return all users who owns the specific user
      parameters:
      - $ref: '#/components/parameters/specificUserId'
      responses:
        '200':
          $ref: '#/components/responses/ListOfUsersResponse'
