openapi: 3.2.0
info:
  title: Cesnet Audit Messages Manager API
  version: 0.0.0
  contact:
    url: https://perun-aai.org
    email: perun@cesnet.cz
  description: 'Operations tagged AuditMessagesManager across 2 of this provider''s published API definitions: cesnet-perun-rpc-openapi.yml, cesnet-perun-rpc-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{server}/{authentication}/rpc
  description: Perun RPC server
  variables:
    server:
      default: api-dev.perun-aai.org
      description: DNS name of a Perun server
    authentication:
      default: ba
      description: 'way of authentication:

        ba - HTTP Basic Auth

        krb - Kerberos

        non - no authentication

        cert - X509 client certificate

        oauth - OAuth 2.0 bearer access token

        fed - SAML federation

        '
      enum:
      - ba
      - krb
      - non
      - cert
      - oauth
      - fed
security:
- BasicAuth: []
- BearerAuth: []
tags:
- name: AuditMessagesManager
  description: AuditMessage RPC API in Perun
  externalDocs:
    url: https://perun-aai.org/documentation/technical-documentation/rpc-api/rpc-javadoc-AuditMessagesManager.html
paths:
  /json/auditMessagesManager/getMessages:
    get:
      tags:
      - AuditMessagesManager
      operationId: getMessages
      summary: Returns 100 newest audit messages from auditLOG.
      parameters:
      - name: count
        in: query
        schema:
          type: integer
        description: Messages limit
        required: false
      responses:
        '200':
          $ref: '#/components/responses/ListOfAuditMessagesResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
    servers:
    - url: https://{server}/{authentication}/rpc
      description: Perun RPC server
      variables:
        server:
          default: api-dev.perun-aai.org
          description: DNS name of a Perun server
        authentication:
          default: ba
          description: 'way of authentication:

            ba - HTTP Basic Auth

            krb - Kerberos

            non - no authentication

            cert - X509 client certificate

            oauth - OAuth 2.0 bearer access token

            fed - SAML federation

            '
          enum:
          - ba
          - krb
          - non
          - cert
          - oauth
          - fed
  /json/auditMessagesManager/getMessagesByCount:
    get:
      tags:
      - AuditMessagesManager
      operationId: getMessagesByCount
      summary: Returns all messages with IDs within the range from max(ID) to (max(ID)-count)…
      parameters:
      - name: count
        in: query
        schema:
          type: integer
        description: Number of IDs to subtract from max_id
        required: true
      responses:
        '200':
          $ref: '#/components/responses/ListOfAuditMessagesResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
    servers:
    - url: https://{server}/{authentication}/rpc
      description: Perun RPC server
      variables:
        server:
          default: api-dev.perun-aai.org
          description: DNS name of a Perun server
        authentication:
          default: ba
          description: 'way of authentication:

            ba - HTTP Basic Auth

            krb - Kerberos

            non - no authentication

            cert - X509 client certificate

            oauth - OAuth 2.0 bearer access token

            fed - SAML federation

            '
          enum:
          - ba
          - krb
          - non
          - cert
          - oauth
          - fed
  /json/auditMessagesManager/getMessagesByIdAndCount:
    get:
      tags:
      - AuditMessagesManager
      operationId: getMessagesByIdAndCount
      summary: Returns "count" number of messages that are more or equal than the given ID…
      parameters:
      - name: id
        in: query
        schema:
          type: integer
        description: Starting id from which the messages will be taken
        required: true
      - name: count
        in: query
        schema:
          type: integer
        description: Number of messages that will be returned
        required: true
      responses:
        '200':
          $ref: '#/components/responses/ListOfAuditMessagesResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
    servers:
    - url: https://{server}/{authentication}/rpc
      description: Perun RPC server
      variables:
        server:
          default: api-dev.perun-aai.org
          description: DNS name of a Perun server
        authentication:
          default: ba
          description: 'way of authentication:

            ba - HTTP Basic Auth

            krb - Kerberos

            non - no authentication

            cert - X509 client certificate

            oauth - OAuth 2.0 bearer access token

            fed - SAML federation

            '
          enum:
          - ba
          - krb
          - non
          - cert
          - oauth
          - fed
  /json/auditMessagesManager/getMessagesPage:
    post:
      tags:
      - AuditMessagesManager
      operationId: getMessagesPage
      summary: Get page of audit messages. Total count is only estimated
      responses:
        '200':
          $ref: '#/components/responses/PaginatedMessagesResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: InputGetMessagesPage
              description: input to get messages page
              type: object
              required:
              - query
              properties:
                query:
                  $ref: '#/components/schemas/AuditMessagesPageQuery'
    servers:
    - url: https://{server}/{authentication}/rpc
      description: Perun RPC server
      variables:
        server:
          default: api-dev.perun-aai.org
          description: DNS name of a Perun server
        authentication:
          default: ba
          description: 'way of authentication:

            ba - HTTP Basic Auth

            krb - Kerberos

            non - no authentication

            cert - X509 client certificate

            oauth - OAuth 2.0 bearer access token

            fed - SAML federation

            '
          enum:
          - ba
          - krb
          - non
          - cert
          - oauth
          - fed
  /json/auditMessagesManager/pollConsumerMessages:
    get:
      tags:
      - AuditMessagesManager
      operationId: pollConsumerMessages
      summary: Returns list of AuditMessages from audit log with IDs > lastProcessedId for…
      parameters:
      - $ref: '#/components/parameters/consumerName'
      responses:
        '200':
          $ref: '#/components/responses/ListOfAuditMessagesResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
    servers:
    - url: https://{server}/{authentication}/rpc
      description: Perun RPC server
      variables:
        server:
          default: api-dev.perun-aai.org
          description: DNS name of a Perun server
        authentication:
          default: ba
          description: 'way of authentication:

            ba - HTTP Basic Auth

            krb - Kerberos

            non - no authentication

            cert - X509 client certificate

            oauth - OAuth 2.0 bearer access token

            fed - SAML federation

            '
          enum:
          - ba
          - krb
          - non
          - cert
          - oauth
          - fed
  /urlinjsonout/auditMessagesManager/setLastProcessedId:
    post:
      tags:
      - AuditMessagesManager
      operationId: setLastProcessedId
      summary: Set ID of last processed message for specified consumer
      parameters:
      - $ref: '#/components/parameters/consumerName'
      - name: lastProcessedId
        in: query
        schema:
          type: integer
        description: id of message to what consumer will be set
        required: true
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
    servers:
    - url: https://{server}/{authentication}/rpc
      description: Perun RPC server
      variables:
        server:
          default: api-dev.perun-aai.org
          description: DNS name of a Perun server
        authentication:
          default: ba
          description: 'way of authentication:

            ba - HTTP Basic Auth

            krb - Kerberos

            non - no authentication

            cert - X509 client certificate

            oauth - OAuth 2.0 bearer access token

            fed - SAML federation

            '
          enum:
          - ba
          - krb
          - non
          - cert
          - oauth
          - fed
  /urlinjsonout/auditMessagesManager/createAuditerConsumer:
    post:
      tags:
      - AuditMessagesManager
      operationId: createAuditerConsumer
      summary: Creates new auditer consumer with last processed id which equals current…
      parameters:
      - $ref: '#/components/parameters/consumerName'
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
    servers:
    - url: https://{server}/{authentication}/rpc
      description: Perun RPC server
      variables:
        server:
          default: api-dev.perun-aai.org
          description: DNS name of a Perun server
        authentication:
          default: ba
          description: 'way of authentication:

            ba - HTTP Basic Auth

            krb - Kerberos

            non - no authentication

            cert - X509 client certificate

            oauth - OAuth 2.0 bearer access token

            fed - SAML federation

            '
          enum:
          - ba
          - krb
          - non
          - cert
          - oauth
          - fed
  /json/auditMessagesManager/getAllAuditerConsumers:
    get:
      tags:
      - AuditMessagesManager
      operationId: getAllAuditerConsumers
      summary: Get all auditer consumers as a map with key=value pairs like…
      responses:
        '200':
          description: map with key=value pairs like String(name)=Integer(lastProcessedId)
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
        default:
          $ref: '#/components/responses/ExceptionResponse'
    servers:
    - url: https://{server}/{authentication}/rpc
      description: Perun RPC server
      variables:
        server:
          default: api-dev.perun-aai.org
          description: DNS name of a Perun server
        authentication:
          default: ba
          description: 'way of authentication:

            ba - HTTP Basic Auth

            krb - Kerberos

            non - no authentication

            cert - X509 client certificate

            oauth - OAuth 2.0 bearer access token

            fed - SAML federation

            '
          enum:
          - ba
          - krb
          - non
          - cert
          - oauth
          - fed
  /json/auditMessagesManager/getLastMessageId:
    get:
      tags:
      - AuditMessagesManager
      operationId: getLastMessageId
      summary: Get ID of last (newest) message in auditer logs
      responses:
        '200':
          $ref: '#/components/responses/IntegerResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
    servers:
    - url: https://{server}/{authentication}/rpc
      description: Perun RPC server
      variables:
        server:
          default: api-dev.perun-aai.org
          description: DNS name of a Perun server
        authentication:
          default: ba
          description: 'way of authentication:

            ba - HTTP Basic Auth

            krb - Kerberos

            non - no authentication

            cert - X509 client certificate

            oauth - OAuth 2.0 bearer access token

            fed - SAML federation

            '
          enum:
          - ba
          - krb
          - non
          - cert
          - oauth
          - fed
  /json/auditMessagesManager/getAuditerMessagesCount:
    get:
      tags:
      - AuditMessagesManager
      operationId: getAuditerMessagesCount
      summary: Get count of all messages stored in auditer logs
      responses:
        '200':
          $ref: '#/components/responses/IntegerResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
    servers:
    - url: https://{server}/{authentication}/rpc
      description: Perun RPC server
      variables:
        server:
          default: api-dev.perun-aai.org
          description: DNS name of a Perun server
        authentication:
