  /json/auditMessagesManager/findAllPossibleEvents:
    get:
      tags:
      - AuditMessagesManager
      operationId: findAllPossibleEvents
      summary: Get list of names of all possible events
      responses:
        '200':
          $ref: '#/components/responses/ListOfStringsResponse'
