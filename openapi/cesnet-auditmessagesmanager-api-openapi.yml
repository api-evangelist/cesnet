components:
  responses:
    PaginatedMessagesResponse:
      description: returns Paginated<AuditMessage>
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaginatedAuditMessages'
    VoidResponse:
      description: returns nothing
    ExceptionResponse:
      description: exception occurred
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PerunException'
    ListOfAuditMessagesResponse:
      description: returns List<AuditMessage>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/AuditMessage'
    IntegerResponse:
      description: returns Integer
      content:
        application/json:
          schema:
            type: integer
    ListOfStringsResponse:
      description: returns List<String>
      content:
        application/json:
          schema:
            type: array
            items:
              type: string
  schemas:
    Facility:
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        uuid:
          type: string
          format: uuid
    PerunBean:
      description: identifiable entity in Perun, common ancestor of all entity classes
      type: object
      properties:
        id:
          type: integer
        beanName:
          type: string
      required:
      - id
      - beanName
      discriminator:
        propertyName: beanName
    AttributeDefinition:
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        friendlyName:
          type: string
        namespace:
          type: string
        description:
          type:
          - string
          - 'null'
        type:
          type: string
        displayName:
          type: string
        writable:
          type: boolean
        unique:
          type: boolean
        friendlyNameParameter:
          type: string
          readOnly: true
        baseFriendlyName:
          type: string
          readOnly: true
        entity:
          type: string
          readOnly: true
    Vo:
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        name:
          type: string
        shortName:
          type: string
        uuid:
          type: string
          format: uuid
    Service:
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        name:
          type: string
        description:
          type: string
        delay:
          type: integer
        recurrence:
          type: integer
        enabled:
          type: boolean
        script:
          type: string
        useExpiredMembers:
          type: boolean
        useExpiredVoMembers:
          type: boolean
        useBannedMembers:
          type: boolean
    Resource:
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        name:
          type: string
        description:
          type: string
        voId:
          type: integer
        facilityId:
          type: integer
        uuid:
          type: string
          format: uuid
    PaginatedAuditMessages:
      properties:
        offset:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditMessage'
      required:
      - offset
      - pageSize
      - totalCount
      - data
    UserExtSource:
      description: represents specific user authentication or identification in external source of data
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        login:
          type: string
        userId:
          type: integer
        loa:
          type: integer
        persistent:
          type: boolean
        lastAccess:
          type: string
          format: timestamp
          description: SQL timestamp
          example: '2012-01-01 00:00:00.100000'
        extSource:
          $ref: '#/components/schemas/ExtSource'
      required:
      - login
      - extSource
    Group:
      allOf:
      - $ref: '#/components/schemas/Auditable'
      type:
      - object
      - 'null'
      properties:
        name:
          type: string
        shortName:
          type: string
        description:
          type:
          - string
          - 'null'
        voId:
          type: integer
        parentGroupId:
          type:
          - integer
          - 'null'
        uuid:
          type: string
          format: uuid
    AuditMessage:
      type: object
      properties:
        event:
          $ref: '#/components/schemas/AuditEvent'
        id:
          type: integer
        actor:
          type: string
        createdAt:
          type: string
        createdByUid:
          type: integer
    PerunException:
      description: exception thrown from inside of Perun
      type: object
      properties:
        errorId:
          type: string
        name:
          type: string
        message:
          type: string
    AuditEvent:
      type: object
      properties:
        attribute:
          $ref: '#/components/schemas/AttributeDefinition'
        extSource:
          $ref: '#/components/schemas/ExtSource'
        source:
          $ref: '#/components/schemas/ExtSource'
        facility:
          $ref: '#/components/schemas/Facility'
        group:
          $ref: '#/components/schemas/Group'
        parentGroup:
          $ref: '#/components/schemas/Group'
        member:
          $ref: '#/components/schemas/Member'
        resource:
          $ref: '#/components/schemas/Resource'
        service:
          $ref: '#/components/schemas/Service'
        user:
          $ref: '#/components/schemas/User'
        userExtSource:
          $ref: '#/components/schemas/UserExtSource'
        vo:
          $ref: '#/components/schemas/Vo'
        name:
          type: string
        message:
          type: string
    ExtSource:
      description: represents external source of data for users such as an IdP or an HR database
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        name:
          type: string
        type:
          type: string
    Auditable:
      description: represents audit information
      allOf:
      - $ref: '#/components/schemas/PerunBean'
      properties:
        createdAt:
          type:
          - string
          - 'null'
        createdBy:
          type:
          - string
          - 'null'
        modifiedAt:
          type:
          - string
          - 'null'
        modifiedBy:
          type:
          - string
          - 'null'
        createdByUid:
          type:
          - integer
          - 'null'
        modifiedByUid:
          type:
          - integer
          - 'null'
    AuditMessagesPageQuery:
      properties:
        pageSize:
          type: integer
        offset:
          type: integer
        order:
          $ref: '#/components/schemas/SortingOrder'
        selectedEvents:
          type: array
          items:
            type: string
      required:
      - pageSize
      - offset
      - order
      - selectedEvents
    SortingOrder:
      type: string
      enum:
      - ASCENDING
      - DESCENDING
    User:
      description: represents user as a physical person
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        firstName:
          type:
          - string
          - 'null'
        lastName:
          type:
          - string
          - 'null'
        middleName:
          type:
          - string
          - 'null'
        titleBefore:
          type:
          - string
          - 'null'
        titleAfter:
          type:
          - string
          - 'null'
        serviceUser:
          type: boolean
        sponsoredUser:
          type: boolean
        uuid:
          type: string
          format: uuid
        specificUser:
          type: boolean
        majorSpecificType:
          type: string
    Member:
      description: represents Member of a Virtual Organization
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        userId:
          type: integer
        voId:
          type: integer
        status:
          type: string
        membershipType:
          type: string
        dualMembership:
          type: boolean
        sourceGroupId:
          type:
          - integer
          - 'null'
        sponsored:
          type: boolean
        groupStatus:
          type: string
        groupStatuses:
          type: object
          additionalProperties:
            type: string
  parameters:
    consumerName:
      name: consumerName
      description: name of the audit message consumer
      schema:
        type: string
      in: query
      required: true
  securitySchemes:
    BasicAuth:
      description: HTTP Basic authentication with username and password
      type: http
      scheme: basic
    BearerAuth:
      description: 'OAuth2 Resource Server authentication using access token in ''Authorization: Bearer'' HTTP header'
      type: http
      scheme: bearer
