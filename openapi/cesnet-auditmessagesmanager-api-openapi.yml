          - oauth
          - fed
  /urlinjsonout/auditMessagesManager/log:
    post:
      tags:
      - AuditMessagesManager
      operationId: auditMessagesManagerLog
      summary: Log arbitrary auditer message/event to the auditLOG
      parameters:
      - name: msg
        in: query
        schema:
          type: string
        description: Message to be logged
        required: true
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
