openapi: 3.2.0
info:
  title: Cesnet Utils API
  version: 0.0.0
  contact:
    url: https://perun-aai.org
    email: perun@cesnet.cz
  description: 'Operations tagged Utils across 2 of this provider''s published API definitions: cesnet-perun-rpc-openapi.yml, cesnet-perun-rpc-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{server}/{authentication}/rpc
  description: Perun RPC server
  variables:
    server:
      default: api-dev.perun-aai.org
      description: DNS name of a Perun server
    authentication:
      default: ba
      description: 'way of authentication:

        ba - HTTP Basic Auth

        krb - Kerberos

        non - no authentication

        cert - X509 client certificate

        oauth - OAuth 2.0 bearer access token

        fed - SAML federation

        '
      enum:
      - ba
      - krb
      - non
      - cert
      - oauth
      - fed
security:
- BasicAuth: []
- BearerAuth: []
tags:
- name: Utils
  description: various utilities
paths:
  /:
    get:
      tags:
      - Utils
      operationId: getPerunRPCVersion
      summary: Gets Perun runtime status
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: 'OK! Version: 3.8.6, User: makub@META, extSource: META'
    servers:
    - url: https://{server}/{authentication}/rpc
      description: Perun RPC server
      variables:
        server:
          default: api-dev.perun-aai.org
          description: DNS name of a Perun server
        authentication:
          default: ba
          description: 'way of authentication:

            ba - HTTP Basic Auth

            krb - Kerberos

            non - no authentication

            cert - X509 client certificate

            oauth - OAuth 2.0 bearer access token

            fed - SAML federation

            '
          enum:
          - ba
          - krb
          - non
          - cert
          - oauth
          - fed
  /json/utils/getPerunStatus:
    get:
      tags:
      - Utils
      operationId: getPerunStatus
      summary: Gets Perun runtime status
      description: 'Returns list of strings which looks like this

        "Version of Perun: 3.8.6",

        "Version of PerunDB: 3.1.55",

        "Version of Servlet: Apache Tomcat/9.0.16 (Debian)",

        "Version of DB-driver: PostgreSQL JDBC Driver-42.2.8",

        "Version of DB: PostgreSQL-12.0 (Debian 12.0-2.pgdg100+1)",

        "Version of Java platform: 11.0.5",

        "AuditerConsumer: ''127.0.0.1:6071'' with last processed id=''23463958''",

        "AuditerConsumer: ''ldapcConsumer'' with last processed id=''23463958''",

        "AuditerConsumer: ''notifications'' with last processed id=''23463952''",

        "LastMessageId: 23463958",

        "Timestamp: 2019-11-14 10:12:30.99"'
      responses:
        '200':
          $ref: '#/components/responses/ListOfStringsResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
    servers:
    - url: https://{server}/{authentication}/rpc
      description: Perun RPC server
      variables:
        server:
          default: api-dev.perun-aai.org
          description: DNS name of a Perun server
        authentication:
          default: ba
          description: 'way of authentication:

            ba - HTTP Basic Auth

            krb - Kerberos

            non - no authentication

            cert - X509 client certificate

            oauth - OAuth 2.0 bearer access token

            fed - SAML federation

            '
          enum:
          - ba
          - krb
          - non
          - cert
          - oauth
          - fed
