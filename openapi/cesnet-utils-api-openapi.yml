    get:
      tags:
      - Utils
      operationId: getPerunStatistics
      summary: Gets Perun runtime statistics
      description: 'Returns list of strings which looks like this

        "Timestamp: ''2019-11-14 10:46:39.613''",

        "USERS: ''39927''",

        "FACILITIES: ''552''",

        "DESTINATIONS: ''2568''",

        "VOS: ''341''",

        "RESOURCES: ''2560''",

        "GROUPS: ''2300''",

