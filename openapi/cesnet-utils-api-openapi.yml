      tags:
      - Utils
      operationId: getGuiConfiguration
      summary: Gets perun-web-gui.properties as Map
      responses:
        '200':
          $ref: '#/components/responses/MapStringStringResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
    servers:
    - url: https://{server}/{authentication}/rpc
      description: Perun RPC server
      variables:
        server:
          default: api-dev.perun-aai.org
          description: DNS name of a Perun server
        authentication:
          default: ba
          description: 'way of authentication:

            ba - HTTP Basic Auth

            krb - Kerberos

            non - no authentication

            cert - X509 client certificate

            oauth - OAuth 2.0 bearer access token

            fed - SAML federation

            '
          enum:
          - ba
          - krb
          - non
          - cert
          - oauth
          - fed
  /json/utils/getAppsConfig:
    get:
      tags:
      - Utils
      operationId: getAppsConfig
      summary: Gets configuration of perun apps brandings and apps' domains
      description: Returns object of type PerunAppsConfig
      responses:
        '200':
          $ref: '#/components/responses/PerunAppsConfigResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
    servers:
    - url: https://{server}/{authentication}/rpc
      description: Perun RPC server
      variables:
        server:
          default: api-dev.perun-aai.org
          description: DNS name of a Perun server
        authentication:
          default: ba
          description: 'way of authentication:

            ba - HTTP Basic Auth

            krb - Kerberos

            non - no authentication

            cert - X509 client certificate

            oauth - OAuth 2.0 bearer access token

            fed - SAML federation

            '
          enum:
          - ba
          - krb
          - non
          - cert
          - oauth
          - fed
  /json/utils/getNewGuiAlert:
    get:
      tags:
      - Utils
      operationId: getNewGuiAlert
      summary: Gets new GUI alert (banner html content) for the brand of incoming request
      description: Returns new GUI alert
      responses:
        '200':
          $ref: '#/components/responses/StringResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
    servers:
    - url: https://{server}/{authentication}/rpc
      description: Perun RPC server
      variables:
        server:
          default: api-dev.perun-aai.org
          description: DNS name of a Perun server
        authentication:
          default: ba
          description: 'way of authentication:

            ba - HTTP Basic Auth

            krb - Kerberos

            non - no authentication

            cert - X509 client certificate

            oauth - OAuth 2.0 bearer access token

            fed - SAML federation

            '
          enum:
          - ba
          - krb
          - non
          - cert
          - oauth
          - fed
components:
  schemas:
    Brand:
      type: object
      properties:
        name:
          type: string
        oldGuiDomain:
          type: string
        newApps:
          $ref: '#/components/schemas/NewApps'
        vos:
          type: array
          items:
            type: string
        oldGuiAlert:
          type: string
    NewApps:
      type: object
      properties:
        api:
          type: string
        admin:
          type: string
        consolidator:
          type: string
        linker:
          type: string
        profile:
          type: string
        pwdReset:
          type: string
        publications:
          type: string
    PerunAppsConfig:
      type: object
      properties:
        brands:
          type: array
          items:
            $ref: '#/components/schemas/Brand'
    PerunException:
      description: exception thrown from inside of Perun
      type: object
      properties:
        errorId:
          type: string
        name:
          type: string
        message:
          type: string
  responses:
    StringResponse:
      description: returns String
      content:
        application/json:
          schema:
            type: string
    ListOfStringsResponse:
      description: returns List<String>
      content:
        application/json:
          schema:
            type: array
            items:
              type: string
    MapStringStringResponse:
      description: returns Map<String,String>
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              type: string
    ExceptionResponse:
      description: exception occurred
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PerunException'
    LongResponse:
      description: returns Long
      content:
        application/json:
          schema:
            type: integer
            format: int64
    PerunAppsConfigResponse:
      description: returns configuration of perun apps brandings and apps' domains
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PerunAppsConfig'
  securitySchemes:
    BasicAuth:
      description: HTTP Basic authentication with username and password
      type: http
      scheme: basic
    BearerAuth:
      description: 'OAuth2 Resource Server authentication using access token in ''Authorization: Bearer'' HTTP header'
      type: http
      scheme: bearer
