openapi: 3.2.0
info:
  version: 0.0.0
  title: Perun RPC Registrar Manager API
  description: Perun Remote Procedure Calls Application Programming Interface
  contact:
    url: https://perun-aai.org
    email: perun@cesnet.cz
servers:
- url: https://{server}/{authentication}/rpc
  description: Perun RPC server
  variables:
    server:
      default: api-dev.perun-aai.org
      description: DNS name of a Perun server
    authentication:
      default: ba
      description: 'way of authentication:

        ba - HTTP Basic Auth

        krb - Kerberos

        non - no authentication

        cert - X509 client certificate

        oauth - OAuth 2.0 bearer access token

        fed - SAML federation

        '
      enum:
      - ba
      - krb
      - non
      - cert
      - oauth
      - fed
security:
- BasicAuth: []
- BearerAuth: []
tags:
- name: RegistrarManager
  description: RegistrarManager RPC API in Perun
  externalDocs:
    url: https://perun-aai.org/documentation/technical-documentation/rpc-api/rpc-javadoc-RegistrarManager.html
paths:
  /json/registrarManager/checkCheckboxHtml:
    post:
      tags:
      - RegistrarManager
      operationId: checkCheckboxHtml
      summary: Check whether input html is safe for our application form item checkbox labels
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: InputCheckCheckboxHtml
              description: input to checkCheckboxHtml
              type: object
              required:
              - html
              properties:
                html:
                  type: string
                  description: string containing the html to check for
  /json/registrarManager/checkHtmlInput:
    post:
      tags:
      - RegistrarManager
      operationId: checkHtmlInput
      summary: Checks whether input is valid html according to the rules in our custom html…
      responses:
        '200':
          $ref: '#/components/responses/StringResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: InputCheckHtmlInput
              description: input to checkHtmlInput
              type: object
              required:
              - html
              properties:
                html:
                  type: string
                  description: input html to check
  /json/registrarManager/consolidateIdentityUsingToken:
    post:
      tags:
      - RegistrarManager
      operationId: consolidateIdentityUsingToken
      summary: Joins current user identity with the one previously provided and referenced by…
      responses:
        '200':
          $ref: '#/components/responses/ListOfUserExtSourcesResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: InputConsolidateIdentityUsingToken
              description: input to consolidateIdentityUsingToken
              type: object
              required:
              - token
              properties:
                token:
                  type: string
                  description: token to be used for joining identities
  /urlinjsonout/registrarManager/sendInvitation:
    post:
      tags:
      - RegistrarManager
      operationId: sendInvitation
      summary: Sends invitation email to user which is not member of VO
      parameters:
      - name: voId
        schema:
          type: number
        in: query
        description: id of VO to send invitation into
      - name: name
        schema:
          type: string
        in: query
        description: name of person used in invitation email (optional)
      - name: email
        schema:
          type: string
        in: query
        required: true
        description: email address to send invitation to
      - name: language
        schema:
          type: string
        in: query
        required: true
        description: preferred language to use
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/registrarManager/sendInvitationsFromCsv:
    post:
      tags:
      - RegistrarManager
      operationId: sendInvitationsFromCsv
      summary: Send invitations with link to VO / Group application form from provided csv…
      responses:
        '200':
          $ref: '#/components/responses/MapStringStringResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: InputInvitationsFromCsv
              description: input for sending invitations from csv
              type: object
              required:
              - voId
              - invitationData
              properties:
                invitationData:
                  type: array
                  items:
                    type: string
                  description: values separated with semicolons
                voId:
                  type: number
                  description: id of VO to send invitation into
                groupId:
                  type: number
                  description: id of Group to send invitation into
                language:
                  type: string
  /urlinjsonout/registrarManager/sendInvitation/g:
    post:
      tags:
      - RegistrarManager
      operationId: sendInvitationForGroup
      summary: Sends invitation email to user which is not member of VO and Group
      description: Invitation link targets VO application form fist, after submission, Group application form is displayed.
      parameters:
      - name: voId
        schema:
          type: number
        in: query
        description: id of VO to send invitation into
      - name: groupId
        schema:
          type: number
        in: query
        description: id of Group to send invitation into
      - name: name
        schema:
          type: string
        in: query
        description: name of person used in invitation email (optional)
      - name: email
        schema:
          type: string
        in: query
        required: true
        description: email address to send invitation to
      - name: language
        schema:
          type: string
        in: query
        required: true
        description: preferred language to use
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /urlinjsonout/registrarManager/sendInvitation/u:
    post:
      tags:
      - RegistrarManager
      operationId: sendInvitationToExistingUser
      summary: Sends invitation email to user which is not member of VO
      parameters:
      - name: userId
        schema:
          type: number
        in: query
        description: id of user to send invitation to
      - name: voId
        schema:
          type: number
        in: query
        description: id of VO to send invitation into
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /urlinjsonout/registrarManager/sendInvitation/u-g:
    post:
      tags:
      - RegistrarManager
      operationId: sendInvitationGroupToExistingUser
      summary: Sends invitation email to user which is not member of Group
      parameters:
      - name: userId
        schema:
          type: number
        in: query
        description: id of user to send invitation to
      - name: voId
        schema:
          type: number
        in: query
        description: id of VO to send invitation into
      - name: groupId
        schema:
          type: number
        in: query
        description: id of Group to send invitation into
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/registrarManager/buildInviteURL:
    get:
      tags:
      - RegistrarManager
      operationId: buildInviteURL
      summary: Creates an invitation link for the given vo/group and namespace (type of…
      parameters:
      - name: voId
        schema:
          type: number
        in: query
        required: true
        description: id of vo for which the invitation link should be created, parent vo of the group if it should be a group invitation
      - name: groupId
        schema:
          type: number
        in: query
        required: false
        description: id of group for which the invitation link should be created
      responses:
        '200':
          $ref: '#/components/responses/StringResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/registrarManager/getApplicationsForVo:
    get:
      tags:
      - RegistrarManager
      operationId: getApplicationsForVo
      summary: Gets all applications for a given VO
      parameters:
      - $ref: '#/components/parameters/voId'
      - name: state[]
        schema:
          type: array
          items:
            type: string
        in: query
        description: 'list of states: NEW, VERIFIED, APPROVED, REJECTED'
      - name: dateFrom
        schema:
          type: string
          format: date
        in: query
        required: false
        description: return applications with the same date or newer than this date
      - name: dateTo
        schema:
          type: string
          format: date
        in: query
        required: false
        description: return applications with the same date or older than this date
      responses:
        '200':
          $ref: '#/components/responses/ListOfApplicationsResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/registrarManager/getApplicationsPage:
    post:
      tags:
      - RegistrarManager
      operationId: getApplicationsPage
      summary: Get page of applications from the given vo, based on the query attributes
      responses:
        '200':
          $ref: '#/components/responses/PaginatedRichApplicationsResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: InputGetPaginatedApplications
              description: input to getPaginatedApplications
              type: object
              required:
              - query
              properties:
                vo:
                  type: integer
                query:
                  $ref: '#/components/schemas/ApplicationsPageQuery'
  /json/registrarManager/getApplicationsForGroup:
    get:
      tags:
      - RegistrarManager
      operationId: getApplicationsForGroup
      summary: Gets all applications for a given Group
      parameters:
      - $ref: '#/components/parameters/groupId'
      - name: state[]
        schema:
          type: array
          items:
            type: string
        in: query
        description: 'list of states: NEW, VERIFIED, APPROVED, REJECTED'
      - name: dateFrom
        schema:
          type: string
          format: date
        in: query
        required: false
        description: return with the same date or applications newer than this date
      - name: dateTo
        schema:
          type: string
          format: date
        in: query
        required: false
        description: return applications with the same date or older than this date
      responses:
        '200':
          $ref: '#/components/responses/ListOfApplicationsResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/registrarManager/getApplicationsForMember:
    get:
      tags:
      - RegistrarManager
      operationId: getApplicationsForMember
      summary: Gets all aplications for a given Member
      parameters:
      - $ref: '#/components/parameters/memberId'
      - $ref: '#/components/parameters/optionalGroupId'
      responses:
        '200':
          $ref: '#/components/responses/ListOfApplicationsResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/registrarManager/getOpenApplicationsForUserInVo:
    get:
      tags:
      - RegistrarManager
      operationId: getOpenApplicationsForUserInVo
      summary: Gets all open applications of the caller in the given VO
      parameters:
      - $ref: '#/components/parameters/voId'
      responses:
        '200':
          $ref: '#/components/responses/ListOfApplicationsResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/registrarManager/getPrincipalsReservedLogins:
    get:
      tags:
      - RegistrarManager
      operationId: getPrincipalsReservedLogins
      summary: Gets logins reserved by the caller in format of `namespace->login`
      responses:
        '200':
          $ref: '#/components/responses/MapStringStringResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/registrarManager/getApplicationById:
    get:
      tags:
      - RegistrarManager
      operationId: getApplicationById
      summary: Returns application object by its id
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          $ref: '#/components/responses/ApplicationResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/registrarManager/getApplicationDataById:
    get:
      tags:
      - RegistrarManager
      operationId: getApplicationDataById
      summary: Returns data submitted by user in given application (by id)
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          $ref: '#/components/responses/ListOfApplicationFormItemDataResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /urlinjsonout/registrarManager/verifyApplication:
    post:
      tags:
      - RegistrarManager
      operationId: verifyApplication
      summary: Forcefully marks application as verified (only when application was in NEW…
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          $ref: '#/components/responses/ApplicationResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /urlinjsonout/registrarManager/approveApplication:
    post:
      tags:
      - RegistrarManager
      operationId: approveApplication
      summary: Manually approves an application
      description: Expected to be called as a result of direct VO administrator action in the web UI.
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          $ref: '#/components/responses/ApplicationResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/registrarManager/canBeApproved:
    get:
      tags:
      - RegistrarManager
      operationId: canBeApproved
      summary: Check if application can be approved based on form module rules.
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/CantBeApprovedExceptionResponse'
  /urlinjsonout/registrarManager/approveApplications:
    post:
      tags:
      - RegistrarManager
      operationId: approveApplications
      summary: Manually approves multiple applications at once
      description: Expected to be called as a result of direct VO administrator action in the web UI.
      parameters:
      - $ref: '#/components/parameters/ids'
      responses:
        '200':
          $ref: '#/components/responses/applicationsOperationResultsResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /urlinjsonout/registrarManager/rejectApplication:
    post:
      tags:
      - RegistrarManager
      operationId: rejectApplication
      summary: Manually rejects an application
      description: Expected to be called as a result of direct VO administrator action in the web UI.
      parameters:
      - $ref: '#/components/parameters/id'
      - name: reason
        schema:
          type: string
        in: query
        description: description of reason
        required: false
      responses:
        '200':
          $ref: '#/components/responses/ApplicationResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /urlinjsonout/registrarManager/rejectApplications:
    post:
      tags:
      - RegistrarManager
      operationId: rejectApplications
      summary: Manually rejects multiple applications at once
      description: Expected to be called as a result of direct VO administrator action in the web UI.
      parameters:
      - $ref: '#/components/parameters/ids'
      - name: reason
        schema:
          type: string
        in: query
        description: description of reason
        required: false
      responses:
        '200':
          $ref: '#/components/responses/applicationsOperationResultsResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /urlinjsonout/registrarManager/deleteApplication:
    post:
      tags:
      - RegistrarManager
      operationId: deleteApplication
      summary: Deletes an application
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /urlinjsonout/registrarManager/deleteApplications:
    post:
      tags:
      - RegistrarManager
      operationId: deleteApplications
      summary: Manually deletes multiple applications at once
      description: Expected to be called as a result of direct VO administrator action in the web UI.
      parameters:
      - $ref: '#/components/parameters/ids'
      responses:
        '200':
          $ref: '#/components/responses/applicationsOperationResultsResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/registrarManager/sendMessage:
    post:
      tags:
      - RegistrarManager
      operationId: sendMessage
      summary: Re-send mail notification for existing application
      description: 'Message of specified type is sent only, when application is in expected state related to the notification.

        Note, that some data related to processing application are not available (e.g. list of exceptions during approval), since this method doesn''t perform any action with Application itself.

        Perun admin can send any notification except USER_INVITE type, see #sendInvitation() for this.'
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: InputSendMessage
              description: input to sendMessage
              type: object
              required:
              - mailType
              - appId
              properties:
                mailType:
                  $ref: '#/components/schemas/MailType'
                appId:
                  type: integer
                  description: application id
                reason:
                  type: string
                  description: 'you can specify reason for case: mailType == APP_REJECTED_USER'
  /json/registrarManager/sendMessageNewRegistrar:
    post:
      tags:
      - RegistrarManager
      operationId: sendMessageNewRegistrar
      summary: Re-send mail notification for existing New Registrar application
      description: 'Message of specified type is sent only, when application is in expected state related to the notification.

        Note, that some data related to processing application are not available (e.g. list of exceptions during approval), since this method doesn''t perform any action with Application itself.

        Perun admin can send any notification except USER_INVITE type, see #sendInvitation() for this.'
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: InputSendMessageNewRegistrar
              description: input to sendMessageNewRegistrar
              type: object
              required:
              - mailType
              - appId
              - issuer
              - identifier
              properties:
                mailType:
                  $ref: '#/components/schemas/MailType'
                group:
                  type: integer
                  description: group id
                vo:
                  type: integer
                  description: vo id
                user:
                  type: integer
                  description: user id
                issuer:
                  type: string
                  description: issuer of the user's identity
                identifier:
                  type: string
                  description: identifier of the user
                newRegAppId:
                  type: string
                  format: uuid
                  description: application id in new Registrar
                newRegAppType:
                  type: string
                  enum:
                  - INITIAL
                  - EXTENSION
                  description: type of the application from new Registrar
                reason:
                  type: string
                  description: 'you can specify reason for case: mailType == APP_REJECTED_USER'
                emailItems:
                  type: object
                  description: Map of the email items, {formItemDataUUID}->{value}
                  additionalProperties:
                    type: string
                itemsByShortname:
                  type: object
                  description: Map of the item data, itemShortname->itemData
                  additionalProperties:
                    type: string
                destinationValues:
                  type: object
                  description: Map of the items with a destination attribute, destinationAttribute->itemData
                  additionalProperties:
                    type: string
  /json/registrarManager/sendMessages:
    post:
      tags:
      - RegistrarManager
      operationId: sendMessages
      summary: Manually re-sends mail notifications for existing applications
      description: Expected to be called as a result of direct VO administrator action in the web UI.
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: InputSendMessages
              description: input to sendMessages
              type: object
              required:
              - mailType
              - ids
              properties:
                mailType:
                  $ref: '#/components/schemas/MailType'
                reason:
                  type: string
                  description: 'you can specify reason for case: mailType == APP_REJECTED_USER'
                ids:
                  type: array
                  items:
                    type: integer
                  description: An array of integers representing the IDs of applications
  /json/registrarManager/getApplicationForm/vo:
    get:
      tags:
      - RegistrarManager
      operationId: getVoApplicationForm
      summary: Gets an application form for a given VO
      description: 'There is exactly one form for membership per VO, one form is used for both initial registration and annual account expansion,

        just the form items are marked whether the should be present in one, the other, or both types of application.'
      parameters:
      - $ref: '#/components/parameters/voId'
      responses:
        '200':
          $ref: '#/components/responses/ApplicationFormResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/registrarManager/getApplicationForm/group:
    get:
      tags:
      - RegistrarManager
      operationId: getGroupApplicationForm
      summary: Gets an application form for a given Group
      description: 'There is exactly one form for membership per Group, one form is used for both initial registration and annual account expansion,

        just the form items are marked whether the should be present in one, the other, or both types of application.'
      parameters:
      - $ref: '#/components/parameters/groupId'
      responses:
        '200':
          $ref: '#/components/responses/ApplicationFormResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /urlinjsonout/registrarManager/getFormItemById:
    get:
      tags:
      - RegistrarManager
      operationId: getFormItemById
      summary: Gets a form item by its id
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          $ref: '#/components/responses/ApplicationFormItemResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/registrarManager/updateFormItemTexts:
    post:
      tags:
      - RegistrarManager
      operationId: updateFormItemTexts
      summary: Update label, options, help and error message for specified form item
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: InputUpdateFormItemTexts
              description: input to updateFormItemTexts
              type: object
              properties:
                formItem:
                  $ref: '#/components/schemas/ApplicationFormItem'
                locale:
                  type:
                  - string
                  - 'null'
  /json/registrarManager/getFormItems/vo:
    get:
      tags:
      - RegistrarManager
      operationId: getFormItemsForVo
      summary: Gets all items in VO application form
      parameters:
      - $ref: '#/components/parameters/voId'
      responses:
        '200':
          $ref: '#/components/responses/ListOfApplicationFormItemsResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/registrarManager/getFormItems/vo-type:
    get:
      tags:
      - RegistrarManager
      operationId: getFormItemsForVoWithType
      summary: Gets items of specified type in VO application form, for initital registration…
      parameters:
      - $ref: '#/components/parameters/voId'
      - name: type
        schema:
          type: string
        in: query
        description: 'application type: INITIAL or EXTENSION'
      responses:
        '200':
          $ref: '#/components/responses/ListOfApplicationFormItemsResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/registrarManager/getFormItems/group:
    get:
      tags:
      - RegistrarManager
      operationId: getFormItemsForGroup
      summary: Gets all items in Group application form
      parameters:
      - $ref: '#/components/parameters/groupId'
      responses:
        '200':
          $ref: '#/components/responses/ListOfApplicationFormItemsResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/registrarManager/getFormItems/group-type:
    get:
      tags:
      - RegistrarManager
      operationId: getFormItemsForGroupWithType
      summary: Gets items of specified type in Group application form, for initital…
      parameters:
      - $ref: '#/components/parameters/groupId'
      - name: type
        schema:
          type: string
        in: query
        description: 'application type: INITIAL, EXTENSION or EMBEDDED'
      responses:
        '200':
          $ref: '#/components/responses/ListOfApplicationFormItemsResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/registrarManager/updateFormItems/vo:
    post:
      tags:
      - RegistrarManager
      operationId: updateFormItemsForVo
      summary: Updates form items sent in list
      responses:
        '200':
          $ref: '#/components/responses/IntegerResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: InputUpdateFormItemsForVo
              description: input to updateFormItemsForVo
              type: object
              properties:
                vo:
                  type: integer
                  description: vo id
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/ApplicationFormItem'
  /json/registrarManager/updateFormItems/group:
    post:
      tags:
      - RegistrarManager
      operationId: updateFormItemsForGroup
      summary: Updates form items sent in list
      responses:
