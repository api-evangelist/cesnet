components:
  responses:
    ListOfRichDestinationsResponse:
      description: returns List<RichDestination>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/RichDestination'
    ListOfServicesResponse:
      description: returns List<Service>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Service'
    ListOfResourcesResponse:
      description: returns List<Resource>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Resource'
    HashedGenDataResponse:
      description: return hashed gen data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HashedGenData'
    VoidResponse:
      description: returns nothing
    ExceptionResponse:
      description: exception occurred
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PerunException'
    ServiceResponse:
      description: returns Service
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Service'
    ListOfServiceForGUIResponse:
      description: return List<ServiceForGUI>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ServiceForGUI'
    IntegerResponse:
      description: returns Integer
      content:
        application/json:
          schema:
            type: integer
    DestinationResponse:
      description: returns Destination
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Destination'
    ListOfDestinationsResponse:
      description: returns List<Destination>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Destination'
  parameters:
    serviceId:
      name: service
      description: id of Service
      schema:
        type: integer
      in: query
      required: true
    voId:
      name: vo
      description: id of Vo
      schema:
        type: integer
      in: query
      required: true
    forceDelete:
      name: force
      description: If true, delete entity forcefully.
      schema:
        type: boolean
      in: query
      required: false
    destinationType:
      name: destinationType
      description: Destination type (like host, user@host, user@host:port, service-specific, ...)
      schema:
        type: string
      in: query
      required: true
    serviceIds:
      name: services[]
      description: list of Service ids List<Integer>
      in: query
      required: true
      schema:
        type: array
        items:
          type: integer
    facilityId:
      name: facility
      description: id of Facility
      schema:
        type: integer
      in: query
      required: true
    attributes:
      name: attributes[]
      description: list of attribute ids List<Integer>
      in: query
      required: true
      schema:
        type: array
        items:
          type: integer
    destinationIds:
      name: destinations[]
      description: list of Destination ids List<Integer>
      in: query
      required: true
      schema:
        type: array
        items:
          type: integer
    destinationId:
      name: destination
      description: id of Destination
      schema:
        type: integer
      in: query
      required: true
    attributeId:
      name: attributeId
      description: id of AttributeDefinition
      schema:
        type: integer
      in: query
      required: true
    attributeDefinitionId:
      name: attributeDefinition
      description: id of AttributeDefinition
      schema:
        type: integer
      in: query
      required: true
    destinationName:
      name: destination
      description: string name of destination
      schema:
        type: string
      in: query
      required: true
    optionalFacilityId:
      name: facility
      description: id of Facility
      schema:
        type: integer
      in: query
      required: false
    id:
      name: id
      description: numeric id
      schema:
        type: integer
      in: query
      required: true
    name:
      name: name
      description: name of entity
      schema:
        type: string
      in: query
      required: true
  schemas:
    Facility:
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        uuid:
          type: string
          format: uuid
    PerunBean:
      description: identifiable entity in Perun, common ancestor of all entity classes
      type: object
      properties:
        id:
          type: integer
        beanName:
          type: string
      required:
      - id
      - beanName
      discriminator:
        propertyName: beanName
    AttributeDefinition:
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        friendlyName:
          type: string
        namespace:
          type: string
        description:
          type:
          - string
          - 'null'
        type:
          type: string
        displayName:
          type: string
        writable:
          type: boolean
        unique:
          type: boolean
        friendlyNameParameter:
          type: string
          readOnly: true
        baseFriendlyName:
          type: string
          readOnly: true
        entity:
          type: string
          readOnly: true
    Service:
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        name:
          type: string
        description:
          type: string
        delay:
          type: integer
        recurrence:
          type: integer
        enabled:
          type: boolean
        script:
          type: string
        useExpiredMembers:
          type: boolean
        useExpiredVoMembers:
          type: boolean
        useBannedMembers:
          type: boolean
    Resource:
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        name:
          type: string
        description:
          type: string
        voId:
          type: integer
        facilityId:
          type: integer
        uuid:
          type: string
          format: uuid
    DestinationType:
      type: string
      description: type of destination, i.e. way of delivery of service settings
      enum:
      - host
      - url
