openapi: 3.2.0
info:
  version: 0.0.0
  title: Perun RPC Members Manager API
  description: Perun Remote Procedure Calls Application Programming Interface
  contact:
    url: https://perun-aai.org
    email: perun@cesnet.cz
servers:
- url: https://{server}/{authentication}/rpc
  description: Perun RPC server
  variables:
    server:
      default: api-dev.perun-aai.org
      description: DNS name of a Perun server
    authentication:
      default: ba
      description: 'way of authentication:

        ba - HTTP Basic Auth

        krb - Kerberos

        non - no authentication

        cert - X509 client certificate

        oauth - OAuth 2.0 bearer access token

        fed - SAML federation

        '
      enum:
      - ba
      - krb
      - non
      - cert
      - oauth
      - fed
security:
- BasicAuth: []
- BearerAuth: []
tags:
- name: MembersManager
  description: MembersManager RPC API in Perun
  externalDocs:
    url: https://perun-aai.org/documentation/technical-documentation/rpc-api/rpc-javadoc-MembersManager.html
paths:
  /json/membersManager/getMemberById:
    get:
      tags:
      - MembersManager
      operationId: getMemberById
      summary: Returns Member by its id
      description: Gets Member
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          $ref: '#/components/responses/MemberResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/membersManager/getRichMemberByUserUUID:
    get:
      tags:
      - MembersManager
      operationId: getRichMemberByUserUUID
      summary: Returns RichMember with attributes by the users' uuid and the vo
      description: Gets RichMember by uuid
      parameters:
      - $ref: '#/components/parameters/voId'
      - $ref: '#/components/parameters/userUuid'
      - $ref: '#/components/parameters/attrNamesOptional'
      responses:
        '200':
          $ref: '#/components/responses/RichMemberResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/membersManager/getMembersByIds:
    get:
      tags:
      - MembersManager
      operationId: getMembersByIds
      summary: Returns list of Members by their ids
      parameters:
      - $ref: '#/components/parameters/ids'
      responses:
        '200':
          $ref: '#/components/responses/ListOfMembersResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/membersManager/getRichMembersByIds:
    get:
      tags:
      - MembersManager
      operationId: getRichMembersByIds
      summary: Returns rich members by their IDs with specific attributes.
      parameters:
      - $ref: '#/components/parameters/ids'
      - $ref: '#/components/parameters/attrNamesOptional'
      responses:
        '200':
          $ref: '#/components/responses/ListOfRichMembersResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/membersManager/getRichMember:
    get:
      tags:
      - MembersManager
      operationId: getRichMember
      summary: Returns RichMember by member id
      description: Get RichMember without attributes
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          $ref: '#/components/responses/RichMemberResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/membersManager/getRichMemberWithAttributes:
    get:
      tags:
      - MembersManager
      operationId: getRichMemberWithAttributes
      summary: Returns Member by its id
      description: Get richMember with member/user attributes
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          $ref: '#/components/responses/RichMemberResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/membersManager/getRichMembersNoUserAttributes:
    get:
      tags:
      - MembersManager
      operationId: getRichMembersNoUserAttributes
      summary: Returns list of all RichMembers for specified VO.
      description: Get richMembers for VO with member attributes (without user attributes).
      parameters:
      - $ref: '#/components/parameters/voId'
      responses:
        '200':
          $ref: '#/components/responses/ListOfRichMembersResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/membersManager/getMemberByUser:
    get:
      tags:
      - MembersManager
      operationId: getMemberByUser
      summary: Returns a Member specified by VO id and User id
      parameters:
      - $ref: '#/components/parameters/voId'
      - $ref: '#/components/parameters/userId'
      responses:
        '200':
          $ref: '#/components/responses/MemberResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/membersManager/getMemberByUserIfExists:
    get:
      tags:
      - MembersManager
      operationId: getMemberByUserIfExists
      summary: Returns a Member specified by VO id and User ID.
      parameters:
      - $ref: '#/components/parameters/voId'
      - $ref: '#/components/parameters/userId'
      responses:
        '200':
          $ref: '#/components/responses/MemberResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/membersManager/getMembersByUser:
    get:
      tags:
      - MembersManager
      operationId: getMembersByUser
      summary: Returns members for a user
      parameters:
      - $ref: '#/components/parameters/userId'
      responses:
        '200':
          $ref: '#/components/responses/ListOfMembersResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/membersManager/getAllMembers:
    get:
      tags:
      - MembersManager
      operationId: getAllMembers
      summary: Get all members from all vos
      responses:
        '200':
          $ref: '#/components/responses/ListOfMembersResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/membersManager/getMembers:
    get:
      tags:
      - MembersManager
      operationId: getMembers
      summary: Returns members of a VO
      parameters:
      - $ref: '#/components/parameters/voId'
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/VoMemberStatuses'
        description: optional status
      responses:
        '200':
          $ref: '#/components/responses/ListOfMembersResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/membersManager/findMembersInVo:
    get:
      tags:
      - MembersManager
      operationId: findMembersInVo
      summary: Searches for members in a VO
      parameters:
      - $ref: '#/components/parameters/voId'
      - $ref: '#/components/parameters/searchString'
      responses:
        '200':
          $ref: '#/components/responses/ListOfMembersResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/membersManager/getMemberByExtSourceNameAndExtLogin:
    get:
      tags:
      - MembersManager
      operationId: getMemberByExtSourceNameAndExtLogin
      summary: Searches for members in a VO
      parameters:
      - $ref: '#/components/parameters/voId'
      - $ref: '#/components/parameters/extLogin'
      - $ref: '#/components/parameters/extSourceName'
      responses:
        '200':
          $ref: '#/components/responses/MemberResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /urlinjsonout/membersManager/validateMemberAsync:
    post:
      tags:
      - MembersManager
      operationId: validateMemberAsync
      summary: Validate all attributes for member and set member's status to VALID.
      parameters:
      - $ref: '#/components/parameters/memberId'
      responses:
        '200':
          $ref: '#/components/responses/MemberResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /urlinjsonout/membersManager/extendMembership:
    post:
      tags:
      - MembersManager
      operationId: extendMembership
      summary: Extend member membership using membershipExpirationRules attribute defined at VO
      parameters:
      - $ref: '#/components/parameters/memberId'
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/membersManager/canExtendMembership:
    get:
      tags:
      - MembersManager
      operationId: canExtendMembership
      summary: Return true if the membership can be extended or if no rules were set for the…
      parameters:
      - $ref: '#/components/parameters/memberId'
      responses:
        '200':
          $ref: '#/components/responses/BooleanResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/membersManager/canExtendInNewRegistrar:
    get:
      tags:
      - MembersManager
      operationId: canExtendInNewRegistrar
      summary: Return true if the membership can be extended or if no rules were set for the…
      parameters:
      - $ref: '#/components/parameters/memberId'
      responses:
        '200':
          $ref: '#/components/responses/BooleanResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/membersManager/canCallerBeMemberWithReason:
    get:
      tags:
      - MembersManager
      operationId: canCallerBeMemberWithReason
      summary: Checks if the caller can apply for membership in VO, throws error containing…
      parameters:
      - $ref: '#/components/parameters/voId'
      responses:
        '200':
          $ref: '#/components/responses/BooleanResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/membersManager/getMembersCount:
    get:
      tags:
      - MembersManager
      operationId: getMembersCount
      summary: Returns count of all VO members
      parameters:
      - $ref: '#/components/parameters/voId'
      responses:
        '200':
          $ref: '#/components/responses/IntegerResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/membersManager/getMembersCount/status:
    get:
      tags:
      - MembersManager
      operationId: getMembersWithStatusCount
      summary: Returns count of VO members with specified status
      parameters:
      - $ref: '#/components/parameters/voId'
      - name: status
        description: status (VALID | INVALID | EXPIRED | DISABLED)
        schema:
          type: string
        in: query
        required: true
      responses:
        '200':
          $ref: '#/components/responses/IntegerResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/membersManager/getSponsoredMembers/v:
    get:
      tags:
      - MembersManager
      operationId: getSponsoredMembers
      summary: Gets members from VO who are sponsored
      parameters:
      - $ref: '#/components/parameters/voId'
      responses:
        '200':
          $ref: '#/components/responses/ListOfRichMembersResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/membersManager/getAllSponsoredMembers:
    get:
      tags:
      - MembersManager
      operationId: getAllSponsoredMembers
      summary: Gets all sponsored members from VO
      parameters:
      - $ref: '#/components/parameters/voId'
      responses:
        '200':
          $ref: '#/components/responses/ListOfRichMembersResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/membersManager/getSponsors/member:
    get:
      tags:
      - MembersManager
      operationId: getSponsorsByMember
      summary: Gets sponsors for given member with optional attribute names
      parameters:
      - $ref: '#/components/parameters/memberId'
      - $ref: '#/components/parameters/attrNamesOptional'
      responses:
        '200':
          $ref: '#/components/responses/ListOfRichUsersResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/membersManager/getSponsors/vo:
    get:
      tags:
      - MembersManager
      operationId: getSponsorsByVo
      summary: Gets sponsors for given VO, extSourceName and extLogin with optional attribute…
      parameters:
      - $ref: '#/components/parameters/voId'
      - $ref: '#/components/parameters/extSourceName'
      - $ref: '#/components/parameters/extLogin'
      - $ref: '#/components/parameters/attrNamesOptional'
      responses:
        '200':
          $ref: '#/components/responses/ListOfRichUsersResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/membersManager/getSponsoredMembersAndTheirSponsors:
    get:
      tags:
      - MembersManager
      operationId: getSponsoredMembersAndTheirSponsors
      summary: Gets list of members with sponsors
      parameters:
      - $ref: '#/components/parameters/voId'
      - $ref: '#/components/parameters/attrNames'
      responses:
        '200':
          $ref: '#/components/responses/ListOfMemberWithSponsorsResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/membersManager/getAllSponsoredMembersAndTheirSponsors:
    get:
      tags:
      - MembersManager
      operationId: getAllSponsoredMembersAndTheirSponsors
      summary: Gets list of VO's all sponsored members with sponsors
      parameters:
      - $ref: '#/components/parameters/voId'
      - $ref: '#/components/parameters/attrNames'
      responses:
        '200':
          $ref: '#/components/responses/ListOfMemberWithSponsorsResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/membersManager/createSponsoredMember/withFullName:
    post:
      tags:
      - MembersManager
      operationId: createSponsoredMember
      summary: Creates a new sponsored member in a given VO and namespace
      responses:
        '200':
          $ref: '#/components/responses/RichMemberResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: InputCreateSponsoredMember
              description: input for createSponsoredMember
              type: object
              required:
              - userData
              - vo
              - sponsor
              properties:
                vo:
                  type: integer
                validityTo:
                  type: string
                sponsor:
                  type: integer
                sendActivationLink:
                  type: boolean
                language:
                  type: string
                userData:
                  $ref: '#/components/schemas/SponsoredUserData'
                baseUrl:
                  type: string
                  description: base url of Perun instance (optional)
  /json/membersManager/setSponsoredMember:
    post:
      tags:
      - MembersManager
      operationId: setSponsoredMember
      summary: Creates a sponsored membership for the given user
      responses:
        '200':
          $ref: '#/components/responses/RichMemberResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: InputSetSponsoredMember
              description: input for setSponsoredMember
              type: object
              required:
              - userToBeSponsored
              - password
              - vo
              - namespace
              properties:
                userToBeSponsored:
                  type: integer
                password:
                  type: string
                vo:
                  type: integer
                sponsor:
                  type: integer
                namespace:
                  type: string
                validityTo:
                  type: string
  /json/membersManager/createSponsoredMembersFromCSV:
    post:
      tags:
      - MembersManager
      operationId: createSponsoredMembersFromCSV
      summary: Creates new sponsored members in a given VO and namespace
      responses:
        '200':
          $ref: '#/components/responses/ListOfMapStringStringResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: InputCreateSponsoredMemberFromCSV
              description: input for createSponsoredMembersFromCSV
              type: object
              required:
              - vo
              - sponsor
              - namespace
              - data
              - header
              properties:
                data:
                  type: array
                  items:
                    type: string
                  description: values separated with semicolons
                header:
                  type: string
                  description: csv header for the given data, values are also split with semicolons
                vo:
                  type: integer
                sponsor:
                  type: integer
                namespace:
                  type: string
                validityTo:
                  type: string
                sendActivationLinks:
                  type: boolean
                language:
                  type: string
                groups:
                  type: array
                  items:
                    type: integer
                  description: groups to which should be the created users assigned
                baseUrl:
                  type: string
                  description: base url of Perun instance (optional)
  /json/membersManager/createSponsoredMembers:
    post:
      tags:
      - MembersManager
      operationId: createSponsoredMembers
      summary: Creates new sponsored members in a given VO and namespace
      responses:
        '200':
          $ref: '#/components/responses/ListOfMapStringStringResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: InputCreateSponsoredMembers
              description: input for createSponsoredMembers
              type: object
              required:
              - guestNames
              - vo
              - sponsor
              - namespace
              properties:
                guestNames:
                  type: array
                  items:
                    type: string
                  description: names of members to create, single name should have the format {firstName};{lastName} to be parsed well
                vo:
                  type: integer
                sponsor:
                  type: integer
                namespace:
                  type: string
                validityTo:
                  type: string
                email:
                  type: string
                sendActivationLink:
                  type: boolean
                language:
                  type: string
                baseUrl:
                  type: string
                  description: base url of Perun instance (optional)
  /json/membersManager/createSpecificMember:
    post:
      tags:
      - MembersManager
      operationId: createSpecificMember
      summary: Creates a new member from candidate which is prepared for creating specificUser
      responses:
        '200':
          $ref: '#/components/responses/MemberResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: InputSpecificMember
              description: input to createSpecificMember
              type: object
              required:
              - candidate
              - vo
              - specificUserType
              - specificUserOwners
              properties:
                candidate:
                  $ref: '#/components/schemas/Candidate'
                vo:
                  type: integer
                specificUserType:
                  type: string
                specificUserOwners:
                  type: array
                  items:
                    $ref: '#/components/schemas/User'
  /urlinjsonout/membersManager/removeSponsor:
    post:
      tags:
      - MembersManager
      operationId: removeSponsor
      summary: Removes sponsor of existing member
      parameters:
      - $ref: '#/components/parameters/memberId'
      - $ref: '#/components/parameters/sponsorId'
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /urlinjsonout/membersManager/removeSponsors:
    post:
      tags:
      - MembersManager
      operationId: removeSponsors
      summary: Removes sponsors of existing member
      parameters:
      - $ref: '#/components/parameters/memberId'
      - name: sponsorIds
        description: list of ids of sponsors
        schema:
          type: array
          items:
            type: integer
        in: query
        required: true
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /urlinjsonout/membersManager/updateSponsorshipValidity:
    post:
      tags:
      - MembersManager
      operationId: updateSponsorshipValidity
      summary: Updates sponsorship validity.
      parameters:
      - $ref: '#/components/parameters/memberId'
      - $ref: '#/components/parameters/sponsorId'
      - $ref: '#/components/parameters/optionalValidityTo'
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /urlinjsonout/membersManager/deleteMember:
    post:
      tags:
      - MembersManager
      operationId: deleteMember
      summary: Deletes only member data appropriated by member id
      parameters:
      - $ref: '#/components/parameters/memberId'
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /urlinjsonout/membersManager/deleteMembers:
    post:
      tags:
      - MembersManager
      operationId: deleteMembers
      summary: Delete members with given ids.
      parameters:
      - $ref: '#/components/parameters/memberIds'
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/membersManager/deleteMembers:
    post:
      tags:
      - MembersManager
      operationId: deleteMembersBodyParams
      summary: Delete members with given ids.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: InputDeleteMembers
              description: input to delete members
              type: object
              required:
              - members
              properties:
                members:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/membersManager/findCompleteRichMembers/v:
    get:
      tags:
      - MembersManager
      operationId: FindCompleteRichMembersForVo
      summary: Return list of richMembers for specific vo by the searchString with attributes…
      parameters:
      - $ref: '#/components/parameters/voId'
      - $ref: '#/components/parameters/attrsNames'
      - $ref: '#/components/parameters/listOfAllowedStatuses'
      - $ref: '#/components/parameters/searchString'
      responses:
        '200':
          $ref: '#/components/responses/ListOfRichMembersResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/membersManager/findCompleteRichMembers/v-sponsored:
    get:
      tags:
      - MembersManager
      operationId: findSponsoredCompleteRichMembersForVo
      summary: Returns list of RichMembers for vo, with reqested attributes, filterd by search…
      parameters:
      - $ref: '#/components/parameters/voId'
      - $ref: '#/components/parameters/attrsNames'
      - $ref: '#/components/parameters/searchString'
      - $ref: '#/components/parameters/onlySponsored'
      responses:
        '200':
          $ref: '#/components/responses/ListOfRichMembersResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/membersManager/findCompleteRichMembers/g:
    get:
      tags:
      - MembersManager
      operationId: FindCompleteRichMembersForGroup
      summary: Return list of richMembers for specific group by the searchString with…
      parameters:
      - $ref: '#/components/parameters/groupId'
      - $ref: '#/components/parameters/attrsNames'
      - $ref: '#/components/parameters/listOfAllowedStatuses'
      - $ref: '#/components/parameters/listOfAllowedGroupStatuses'
      - $ref: '#/components/parameters/searchString'
      - $ref: '#/components/parameters/lookingInParentGroup'
      responses:
        '200':
          $ref: '#/components/responses/ListOfRichMembersResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/membersManager/findCompleteRichMembers/attrs:
    get:
      tags:
      - MembersManager
      operationId: FindCompleteRichMembersByAttributes
      summary: Return list of richMembers from perun by the searchString with attributes…
      parameters:
      - $ref: '#/components/parameters/attrsNames'
      - $ref: '#/components/parameters/searchString'
      - $ref: '#/components/parameters/listOfAllowedStatuses'
      responses:
        '200':
          $ref: '#/components/responses/ListOfRichMembersResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/membersManager/createMember/extSource:
    post:
      tags:
      - MembersManager
      operationId: createMemberFromExtSource
      summary: Creates a new member and sets all member's attributes from the candidate.
      responses:
        '200':
          $ref: '#/components/responses/MemberResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: InputCreateMemberFromExtSource
              description: input to create member from extSource
              type: object
              required:
              - vo
              - extSourceName
              - extSourceType
              - login
              - candidate
              properties:
                vo:
                  type: integer
                extSourceName:
                  type: string
                extSourceType:
                  type: string
                login:
                  type: string
                candidate:
                  $ref: '#/components/schemas/Candidate'
                groups:
                  type: array
                  items:
                    $ref: '#/components/schemas/Group'
  /json/membersManager/createMember/u:
    post:
      tags:
      - MembersManager
      operationId: CreateMemberForUser
      summary: Creates a new member from user.
      responses:
        '200':
          $ref: '#/components/responses/MemberResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: InputCreateMemberForUser
              description: input to create member for user
              type: object
              required:
              - vo
              - user
              properties:
                vo:
                  type: integer
                user:
                  type: integer
                groups:
                  type: array
                  items:
                    $ref: '#/components/schemas/Group'
  /json/membersManager/createMember/c:
    post:
      tags:
      - MembersManager
      operationId: createMemberForCandidate
      summary: Creates a new member from candidate returned by the method…
      responses:
        '200':
          $ref: '#/components/responses/MemberResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
      requestBody:
        required: true
        content:
          application/json:
