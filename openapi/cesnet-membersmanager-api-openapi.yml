components:
  schemas:
    ExtSource:
      description: represents external source of data for users such as an IdP or an HR database
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        name:
          type: string
        type:
          type: string
    SponsoredUserData:
      type: object
      properties:
        guestName:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        titleBefore:
          type: string
        titleAfter:
          type: string
        namespace:
          type: string
        email:
          type: string
        password:
          type: string
        login:
          type: string
    RegistrarApplicationInput:
      title: RegistrarApplicationInput
      description: input for registrar application endpoints
      type: object
      required:
      - vo
      - attributes
      - oidcAttributes
      properties:
        vo:
          type: integer
          description: ID of the Virtual Organization
        group:
          type:
          - integer
          - 'null'
          description: ID of the Group to add the member to (optional, null for VO applications)
        attributes:
          type: object
          additionalProperties:
            type: string
          description: 'Map of the application attributes (key: attr name, value: attr value)'
        oidcAttributes:
          type: object
          additionalProperties:
            type: string
          description: Map of OIDC attributes (must contain iss and sub claims)
    Candidate:
      allOf:
      - $ref: '#/components/schemas/User'
      properties:
        userExtSource:
          $ref: '#/components/schemas/UserExtSource'
        additionalUserExtSources:
          type: array
          items:
            $ref: '#/components/schemas/UserExtSource'
        attributes:
          type: object
          additionalProperties:
            type: string
        expectedSyncGroupStatus:
          type: string
    MemberWithSponsors:
      type: object
      properties:
        member:
          $ref: '#/components/schemas/RichMember'
        sponsors:
          type: array
          items:
            $ref: '#/components/schemas/Sponsor'
    NamespaceRules:
      type: object
      properties:
        defaultEmail:
          type: string
        csvGenHeader:
          type: string
        csvGenPlaceholder:
          type: string
        csvGenHeaderDescription:
          type: string
        namespaceName:
          type: string
        requiredAttributes:
          type: array
          items:
            type: string
        optionalAttributes:
          type: array
          items:
            type: string
      required:
      - namespaceName
    PerunException:
      description: exception thrown from inside of Perun
      type: object
      properties:
        errorId:
          type: string
        name:
          type: string
        message:
          type: string
    MemberGroupStatus:
      type: string
      description: statuses of a member in a group
      enum:
      - VALID
      - EXPIRED
    AttributeDefinition:
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        friendlyName:
          type: string
        namespace:
          type: string
        description:
          type:
          - string
          - 'null'
        type:
          type: string
        displayName:
          type: string
        writable:
          type: boolean
        unique:
          type: boolean
        friendlyNameParameter:
          type: string
          readOnly: true
        baseFriendlyName:
          type: string
          readOnly: true
        entity:
          type: string
          readOnly: true
    PerunBean:
      description: identifiable entity in Perun, common ancestor of all entity classes
      type: object
      properties:
        id:
          type: integer
        beanName:
          type: string
      required:
      - id
      - beanName
      discriminator:
        propertyName: beanName
    RichUser:
      description: user data packed together with all user attributes and UserExtSources
      allOf:
      - $ref: '#/components/schemas/User'
      properties:
        userExtSources:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/UserExtSource'
        userAttributes:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Attribute'
      required:
      - userExtSources
      - userAttributes
    Attribute:
      allOf:
      - $ref: '#/components/schemas/AttributeDefinition'
      properties:
        valueCreatedAt:
          type:
          - string
          - 'null'
        valueCreatedBy:
          type:
          - string
          - 'null'
        valueModifiedAt:
          type:
          - string
          - 'null'
        valueModifiedBy:
          type:
          - string
          - 'null'
        value: {}
    PaginatedRichMembers:
      properties:
        offset:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/RichMember'
      required:
      - offset
      - pageSize
      - totalCount
      - data
    Sponsor:
      description: represents a Sponsor for some specific member
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        userExtSources:
          type: array
          items:
            $ref: '#/components/schemas/UserExtSource'
        userAttributes:
          type: array
          items:
            $ref: '#/components/schemas/Attribute'
        validityTo:
          type: string
          description: Date in format yyyy-MM-dd}
        active:
          type: boolean
      required:
      - user
      - userExtSources
      - userAttributes
      - validityTo
      - active
    UserExtSource:
      description: represents specific user authentication or identification in external source of data
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        login:
          type: string
        userId:
          type: integer
        loa:
          type: integer
        persistent:
          type: boolean
        lastAccess:
          type: string
          format: timestamp
          description: SQL timestamp
          example: '2012-01-01 00:00:00.100000'
        extSource:
          $ref: '#/components/schemas/ExtSource'
      required:
      - login
      - extSource
    MembersOrderColumn:
      type: string
      enum:
      - ID
      - NAME
      - EMAIL
      - GROUP_STATUS
      - STATUS
      - ORGANIZATION
    MembersPageQuery:
      properties:
        pageSize:
          type: integer
        offset:
          type: integer
        order:
          $ref: '#/components/schemas/SortingOrder'
        sortColumn:
          $ref: '#/components/schemas/MembersOrderColumn'
        searchString:
          type: string
        statuses:
          type: array
          items:
            $ref: '#/components/schemas/VoMemberStatuses'
        groupId:
          type: integer
        groupStatuses:
          type: array
          items:
            $ref: '#/components/schemas/MemberGroupStatus'
      required:
      - pageSize
      - offset
      - order
      - sortColumn
    Group:
      allOf:
      - $ref: '#/components/schemas/Auditable'
      type:
      - object
      - 'null'
      properties:
        name:
          type: string
        shortName:
          type: string
        description:
          type:
          - string
          - 'null'
        voId:
          type: integer
        parentGroupId:
          type:
          - integer
          - 'null'
        uuid:
          type: string
          format: uuid
    RichMember:
      description: Member data packed with member and user attributes, User and UserExtSources
      allOf:
      - $ref: '#/components/schemas/Member'
      properties:
        user:
          $ref: '#/components/schemas/User'
        userExtSources:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/UserExtSource'
        userAttributes:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Attribute'
        memberAttributes:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Attribute'
      required:
      - user
      - userExtSources
    User:
      description: represents user as a physical person
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        firstName:
          type:
          - string
          - 'null'
        lastName:
          type:
          - string
          - 'null'
        middleName:
          type:
          - string
          - 'null'
        titleBefore:
          type:
          - string
          - 'null'
        titleAfter:
          type:
          - string
          - 'null'
        serviceUser:
          type: boolean
        sponsoredUser:
          type: boolean
        uuid:
          type: string
          format: uuid
        specificUser:
          type: boolean
        majorSpecificType:
          type: string
    Member:
      description: represents Member of a Virtual Organization
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        userId:
          type: integer
        voId:
          type: integer
        status:
          type: string
        membershipType:
          type: string
        dualMembership:
          type: boolean
        sourceGroupId:
          type:
          - integer
          - 'null'
        sponsored:
          type: boolean
        groupStatus:
          type: string
        groupStatuses:
          type: object
          additionalProperties:
            type: string
    SortingOrder:
      type: string
      enum:
      - ASCENDING
      - DESCENDING
    MemberCandidate:
      type: object
      properties:
        candidate:
          $ref: '#/components/schemas/Candidate'
        member:
          $ref: '#/components/schemas/Member'
        richUser:
          $ref: '#/components/schemas/RichUser'
    VoMemberStatuses:
      type: string
      description: statuses of a member in a Vo
      enum:
      - VALID
      - INVALID
      - EXPIRED
      - DISABLED
    Auditable:
      description: represents audit information
      allOf:
      - $ref: '#/components/schemas/PerunBean'
      properties:
        createdAt:
          type:
          - string
          - 'null'
        createdBy:
          type:
          - string
          - 'null'
        modifiedAt:
          type:
          - string
          - 'null'
        modifiedBy:
          type:
          - string
          - 'null'
        createdByUid:
          type:
          - integer
          - 'null'
        modifiedByUid:
          type:
          - integer
          - 'null'
  parameters:
    memberId:
      name: member
      description: id of Member
      schema:
        type: integer
      in: query
      required: true
    attrsNames:
      name: attrsNames[]
      description: list of attribute names List<String>
      in: query
      required: true
      schema:
        type: array
        items:
          type: string
    groupId:
      name: group
      description: id of Group
      schema:
        type: integer
      in: query
      required: true
    sponsoredMemberId:
      name: sponsoredMember
      description: id of member to be sponsored
      schema:
        type: integer
      in: query
      required: true
    attrNamesOptional:
      name: attrNames[]
      description: list of attribute names List<String> or null
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
    resourceId:
      name: resource
      description: id of Resource
      schema:
        type: integer
