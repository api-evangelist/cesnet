openapi: 3.2.0
info:
  version: 0.0.0
  title: Perun RPC Vos Manager API
  description: Perun Remote Procedure Calls Application Programming Interface
  contact:
    url: https://perun-aai.org
    email: perun@cesnet.cz
servers:
- url: https://{server}/{authentication}/rpc
  description: Perun RPC server
  variables:
    server:
      default: api-dev.perun-aai.org
      description: DNS name of a Perun server
    authentication:
      default: ba
      description: 'way of authentication:

        ba - HTTP Basic Auth

        krb - Kerberos

        non - no authentication

        cert - X509 client certificate

        oauth - OAuth 2.0 bearer access token

        fed - SAML federation

        '
      enum:
      - ba
      - krb
      - non
      - cert
      - oauth
      - fed
security:
- BasicAuth: []
- BearerAuth: []
tags:
- name: VosManager
  description: VosManager RPC API in Perun
  externalDocs:
    url: https://perun-aai.org/documentation/technical-documentation/rpc-api/rpc-javadoc-VosManager.html
paths:
  /json/vosManager/getVos:
    get:
      tags:
      - VosManager
      operationId: getMyVos
      summary: Return list of all VOs the caller is associated with
      responses:
        '200':
          $ref: '#/components/responses/ListOfVosResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/vosManager/getEnrichedVos:
    get:
      tags:
      - VosManager
      operationId: getMyEnrichedVos
      summary: Return list of all EnrichedVos the caller is associated with
      responses:
        '200':
          $ref: '#/components/responses/ListOfEnrichedVosResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/vosManager/getAllVos:
    get:
      tags:
      - VosManager
      operationId: getAllVos
      summary: Return list of all VOs in Perun
      responses:
        '200':
          $ref: '#/components/responses/ListOfVosResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /urlinjsonout/vosManager/deleteVo:
    post:
      tags:
      - VosManager
      operationId: deleteVo
      summary: Deletes a VO.
      parameters:
      - $ref: '#/components/parameters/voId'
      - $ref: '#/components/parameters/forceDelete'
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/vosManager/createVo/withVo:
    post:
      tags:
      - VosManager
      operationId: createVoWithVo
      summary: Creates new VO.
      responses:
        '200':
          $ref: '#/components/responses/VoResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: InputCreateVoWithVo
              description: input to createVoWithVo
              type: object
              required:
              - vo
              properties:
                vo:
                  $ref: '#/components/schemas/Vo'
  /urlinjsonout/vosManager/createVo/withName:
    post:
      tags:
      - VosManager
      operationId: createVoWithName
      summary: Creates new VO. Caller is automatically set as VO manager
      parameters:
      - name: name
        description: name - length can be no more than 128 characters
        schema:
          type: string
        in: query
        required: true
      - name: shortName
        description: shortName - can contain only a-z, A-Z, 0-9, '.', '-', '_' and cannot be longer than 32 characters
        schema:
          type: string
        in: query
        required: true
      responses:
        '200':
          $ref: '#/components/responses/VoResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/vosManager/updateVo:
    post:
      tags:
      - VosManager
      operationId: updateVo
      summary: Updates a VO.
      responses:
        '200':
          $ref: '#/components/responses/VoResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: InputUpdateVo
              description: input to updateVo
              type: object
              required:
              - vo
              properties:
                vo:
                  $ref: '#/components/schemas/Vo'
  /json/vosManager/getVoByShortName:
    get:
      tags:
      - VosManager
      operationId: getVoByShortName
      summary: Returns a VO by its short name
      parameters:
      - name: shortName
        required: true
        description: short name of Vo
        schema:
          type: string
        in: query
      responses:
        '200':
          $ref: '#/components/responses/VoResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/vosManager/getVoById:
    get:
      tags:
      - VosManager
      operationId: getVoById
      summary: Returns a virtual organization by id
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          $ref: '#/components/responses/VoResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/vosManager/getEnrichedVoById:
    get:
      tags:
      - VosManager
      operationId: getEnrichedVoById
      summary: Returns an enriched virtual organization by id
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          $ref: '#/components/responses/EnrichedVoResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/vosManager/getVosByIds:
    get:
      tags:
      - VosManager
      operationId: getVosByIds
      summary: Return list of VOs by their ids
      parameters:
      - $ref: '#/components/parameters/ids'
      responses:
        '200':
          $ref: '#/components/responses/ListOfVosResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/vosManager/findCandidates:
    get:
      tags:
      - VosManager
      operationId: findCandidates
      summary: Find candidates for VO.
      parameters:
      - $ref: '#/components/parameters/voId'
      - $ref: '#/components/parameters/searchString'
      responses:
        '200':
          $ref: '#/components/responses/ListOfCandidatesResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/vosManager/findCandidates/forGroup:
    get:
      tags:
      - VosManager
      operationId: findCandidatesForGroup
      summary: Find candidates for Group.
      parameters:
      - $ref: '#/components/parameters/groupId'
      - $ref: '#/components/parameters/searchString'
      responses:
        '200':
          $ref: '#/components/responses/ListOfCandidatesResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/vosManager/getCompleteCandidates/forVo:
    get:
      tags:
      - VosManager
      operationId: getCompleteCandidatesForVo
      summary: Find MemberCandidates for VO.
      parameters:
      - $ref: '#/components/parameters/voId'
      - $ref: '#/components/parameters/attrNames'
      - $ref: '#/components/parameters/searchString'
      responses:
        '200':
          $ref: '#/components/responses/ListOfMemberCandidatesResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/vosManager/getCompleteCandidates/forGroup:
    get:
      tags:
      - VosManager
      operationId: getCompleteCandidatesForGroup
      summary: Find MemberCandidates for GROUP.
      parameters:
      - $ref: '#/components/parameters/groupId'
      - $ref: '#/components/parameters/attrNames'
      - $ref: '#/components/parameters/searchString'
      responses:
        '200':
          $ref: '#/components/responses/ListOfMemberCandidatesResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/vosManager/getVosCount:
    get:
      tags:
      - VosManager
      operationId: getVosCount
      summary: Gets count of all vos
      responses:
        '200':
          $ref: '#/components/responses/IntegerResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/vosManager/getVoMembersCountsByStatus:
    get:
      tags:
      - VosManager
      operationId: getVoMembersCountsByStatus
      summary: Returns number of vo members by their status
      parameters:
      - $ref: '#/components/parameters/voId'
      responses:
        '200':
          $ref: '#/components/responses/MapStringIntegerResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /urlinjsonout/vosManager/addAdmin/user:
    post:
      tags:
      - VosManager
      operationId: addVoAdminUser
      summary: Adds a user as a Vo admin
      parameters:
      - $ref: '#/components/parameters/voId'
      - $ref: '#/components/parameters/userId'
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /urlinjsonout/vosManager/addAdmin/group:
    post:
      tags:
      - VosManager
      operationId: addVoAdminGroup
      summary: Adds a group as a Vo admin
      parameters:
      - $ref: '#/components/parameters/voId'
      - $ref: '#/components/parameters/authorizedGroup'
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /urlinjsonout/vosManager/addSponsorRole/user:
    post:
      tags:
      - VosManager
      operationId: addSponsorRoleToUser
      summary: Add user as a sponsor for guest members of VO
      parameters:
      - $ref: '#/components/parameters/voId'
      - $ref: '#/components/parameters/userId'
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /urlinjsonout/vosManager/addSponsorRole/group:
    post:
      tags:
      - VosManager
      operationId: addSponsorRoleToGroup
      summary: Add group as a sponsor of guest members of VO.
      parameters:
      - $ref: '#/components/parameters/voId'
      - $ref: '#/components/parameters/authorizedGroup'
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /urlinjsonout/vosManager/removeAdmin/user:
    post:
      tags:
      - VosManager
      operationId: removeVoAdminUser
      summary: Removes a user as a Vo admin
      parameters:
      - $ref: '#/components/parameters/voId'
      - $ref: '#/components/parameters/userId'
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /urlinjsonout/vosManager/removeAdmin/group:
    post:
      tags:
      - VosManager
      operationId: removeVoAdminGroup
      summary: Removes a group as a Vo admin
      parameters:
      - $ref: '#/components/parameters/voId'
      - $ref: '#/components/parameters/authorizedGroup'
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /urlinjsonout/vosManager/removeSponsorRole/user:
    post:
      tags:
      - VosManager
      operationId: removeSponsorRoleFromUser
      summary: Removes user as a sponsor.
      parameters:
      - $ref: '#/components/parameters/voId'
      - $ref: '#/components/parameters/userId'
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /urlinjsonout/vosManager/removeSponsorRole/group:
    post:
      tags:
      - VosManager
      operationId: removeSponsorRoleFromGroup
      summary: Removes group as a sponsor.
      parameters:
      - $ref: '#/components/parameters/voId'
      - $ref: '#/components/parameters/authorizedGroup'
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/vosManager/getAdmins:
    get:
      tags:
      - VosManager
      operationId: getVoAdminUsers
      description: 'Get list of all vo administrators for supported role and specific vo.

        If onlyDirectAdmins is true, return only direct admins of the vo for supported role.

        Otherwise return direct admins and users who are VALID members of administrator groups

        Supported roles: VOOBSERVER, TOPGROUPCREATOR, VOADMIN'
      parameters:
      - $ref: '#/components/parameters/voId'
      - name: role
        schema:
          $ref: '#/components/schemas/VoAdminRoles'
        in: query
        required: true
        description: supported role name
      - name: onlyDirectAdmins
        schema:
          type: boolean
        in: query
        required: true
        description: get only direct administrators (if false, get both direct and indirect)
      responses:
        '200':
          $ref: '#/components/responses/ListOfUsersResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
      summary: Get vo admin users
      x-summary-source: derived
  /json/vosManager/getAdminGroups:
    get:
      tags:
      - VosManager
      operationId: getVoAdminGroups
      description: 'Get list of administrator groups of the given VO.

        Supported roles: VOOBSERVER, TOPGROUPCREATOR, VOADMIN'
      parameters:
      - $ref: '#/components/parameters/voId'
      - name: role
        schema:
          $ref: '#/components/schemas/VoAdminRoles'
        in: query
        required: true
        description: supported role name
      responses:
        '200':
          $ref: '#/components/responses/ListOfGroupsResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
      summary: Get vo admin groups
      x-summary-source: derived
  /json/vosManager/getRichAdmins:
    get:
      tags:
      - VosManager
      operationId: getRichAdminsForVo
      description: 'Get list of all richUser administrators for the vo and supported role with specific attributes.

        If some group is administrator of the given group, all VALID members are included in the list.

        Supported roles: VOOBSERVER, TOPGROUPCREATOR, VOADMIN

        If "onlyDirectAdmins" is == true, return only direct admins of the vo for supported role with specific attributes.

        If "allUserAttributes" is == true, do not specify attributes through list and return them all in objects richUser. Ignoring list of specific attributes.'
      parameters:
      - $ref: '#/components/parameters/voId'
      - name: role
        schema:
          $ref: '#/components/schemas/VoAdminRoles'
        in: query
        required: true
        description: role name
      - $ref: '#/components/parameters/specificAttributes'
      - name: allUserAttributes
        schema:
          type: boolean
        in: query
        required: true
        description: if == true, get all possible user attributes and ignore list of specificAttributes (if false, get only specific attributes)
      - name: onlyDirectAdmins
        schema:
          type: boolean
        in: query
        required: true
        description: if == true, get only direct vo administrators (if false, get both direct and indirect)
      responses:
        '200':
          $ref: '#/components/responses/ListOfRichUsersResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
      summary: Get rich admins for vo
      x-summary-source: derived
  /json/vosManager/setBan:
    post:
      tags:
      - VosManager
      operationId: setVoBan
      description: 'Set ban for member on his vo. The member id is required,

        validityTo and description are optional. voId is ignored.'
      responses:
        '200':
          $ref: '#/components/responses/BanOnVoResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: InputSetVoBan
              description: input to set vo ban
              type: object
              required:
              - banOnVo
              properties:
                banOnVo:
                  $ref: '#/components/schemas/BanOnVo'
      summary: Set vo ban
      x-summary-source: derived
  /urlinjsonout/vosManager/removeBan:
    post:
      tags:
      - VosManager
      operationId: removeVoBan
      summary: Remove vo ban with given id
      parameters:
      - $ref: '#/components/parameters/banId'
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /urlinjsonout/vosManager/removeBanForMember:
    post:
      tags:
      - VosManager
      operationId: removeVoBanForMember
      summary: Remove vo ban for member with given id
      parameters:
      - $ref: '#/components/parameters/memberId'
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/vosManager/updateBan:
    post:
      tags:
      - VosManager
      operationId: updateVoBan
      summary: Update existing ban (description, validation timestamp)
      responses:
        '200':
          $ref: '#/components/responses/BanOnVoResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: InputUpdateBan
              description: input to updateBan
              type: object
              required:
              - banOnVo
              properties:
                banOnVo:
                  $ref: '#/components/schemas/BanOnVo'
  /json/vosManager/getBanById:
    get:
      tags:
      - VosManager
      operationId: getVoBanById
      summary: Get vo ban with given id
      parameters:
      - $ref: '#/components/parameters/banId'
      responses:
        '200':
          $ref: '#/components/responses/BanOnVoResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/vosManager/getBanForMember:
    get:
      tags:
      - VosManager
      operationId: getVoBanForMember
      summary: Get ban for given member, or null if he is not banned
      parameters:
      - $ref: '#/components/parameters/memberId'
      responses:
        '200':
          $ref: '#/components/responses/BanOnVoResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/vosManager/getBansForVo:
    get:
      tags:
      - VosManager
      operationId: getVoBansForVo
      summary: Get list of all bans for vo with given id
      parameters:
      - $ref: '#/components/parameters/voId'
      responses:
        '200':
          $ref: '#/components/responses/ListOfBanOnVoResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/vosManager/getEnrichedBansForVo:
    get:
      tags:
      - VosManager
      operationId: getEnrichedBansForVo
      summary: Get list of all enriched bans for vo
      parameters:
      - $ref: '#/components/parameters/voId'
      - $ref: '#/components/parameters/attrNamesOptional'
      responses:
        '200':
          $ref: '#/components/responses/ListOfEnrichedBanOnVoResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/vosManager/getEnrichedBansForUser:
    get:
      tags:
      - VosManager
      operationId: getEnrichedVoBansForUser
      summary: Get list of all enriched bans for user
      parameters:
      - $ref: '#/components/parameters/userId'
      - $ref: '#/components/parameters/attrNamesOptional'
      responses:
        '200':
          $ref: '#/components/responses/ListOfEnrichedBanOnVoResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /urlinjsonout/vosManager/addMemberVo:
    post:
      tags:
      - VosManager
      operationId: addMemberVo
      summary: Add member vo to vo
      parameters:
      - $ref: '#/components/parameters/voId'
      - $ref: '#/components/parameters/memberVoId'
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /urlinjsonout/vosManager/removeMemberVo:
    post:
      tags:
      - VosManager
      operationId: removeMemberVo
      summary: Remove member vo from vo
      parameters:
      - $ref: '#/components/parameters/voId'
      - $ref: '#/components/parameters/memberVoId'
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/vosManager/getMemberVos:
    get:
      tags:
      - VosManager
      operationId: getMemberVos
      summary: Get list of all members organizations of a vo
      parameters:
      - $ref: '#/components/parameters/voId'
      responses:
        '200':
          $ref: '#/components/responses/ListOfVosResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/vosManager/getParentVos:
    get:
      tags:
      - VosManager
      operationId: getParentVos
      summary: Get list of all parent organizations of a vo
      parameters:
      - $ref: '#/components/parameters/voId'
      responses:
        '200':
          $ref: '#/components/responses/ListOfVosResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
components:
  schemas:
    ExtSource:
      description: represents external source of data for users such as an IdP or an HR database
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        name:
          type: string
        type:
          type: string
    VoAdminRoles:
      type: string
      description: admin roles for a Vo
      enum:
      - VOOBSERVER
      - TOPGROUPCREATOR
      - VOADMIN
    Candidate:
      allOf:
      - $ref: '#/components/schemas/User'
      properties:
        userExtSource:
          $ref: '#/components/schemas/UserExtSource'
        additionalUserExtSources:
          type: array
          items:
            $ref: '#/components/schemas/UserExtSource'
        attributes:
          type: object
          additionalProperties:
            type: string
        expectedSyncGroupStatus:
          type: string
    EnrichedBanOnVo:
      type: object
      properties:
        vo:
          $ref: '#/components/schemas/Vo'
        member:
          $ref: '#/components/schemas/RichMember'
        ban:
          $ref: '#/components/schemas/BanOnVo'
    PerunException:
      description: exception thrown from inside of Perun
      type: object
      properties:
        errorId:
          type: string
        name:
          type: string
        message:
          type: string
    AttributeDefinition:
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        friendlyName:
          type: string
        namespace:
          type: string
        description:
          type:
          - string
          - 'null'
        type:
          type: string
        displayName:
          type: string
        writable:
          type: boolean
        unique:
          type: boolean
        friendlyNameParameter:
          type: string
          readOnly: true
        baseFriendlyName:
          type: string
          readOnly: true
        entity:
          type: string
          readOnly: true
    PerunBean:
      description: identifiable entity in Perun, common ancestor of all entity classes
      type: object
      properties:
        id:
          type: integer
        beanName:
          type: string
      required:
      - id
      - beanName
      discriminator:
        propertyName: beanName
    RichUser:
      description: user data packed together with all user attributes and UserExtSources
      allOf:
      - $ref: '#/components/schemas/User'
      properties:
        userExtSources:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/UserExtSource'
        userAttributes:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Attribute'
      required:
      - userExtSources
      - userAttributes
    Attribute:
      allOf:
      - $ref: '#/components/schemas/AttributeDefinition'
      properties:
        valueCreatedAt:
          type:
          - string
          - 'null'
        valueCreatedBy:
          type:
          - string
          - 'null'
        valueModifiedAt:
          type:
          - string
          - 'null'
        valueModifiedBy:
          type:
          - string
          - 'null'
        value: {}
    Ban:
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        validityTo:
          type: string
        description:
          type: string
    UserExtSource:
      description: represents specific user authentication or identification in external source of data
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        login:
          type: string
        userId:
          type: integer
        loa:
          type: integer
        persistent:
          type: boolean
        lastAccess:
          type: string
          format: timestamp
          description: SQL timestamp
          example: '2012-01-01 00:00:00.100000'
        extSource:
          $ref: '#/components/schemas/ExtSource'
      required:
      - login
      - extSource
    Vo:
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        name:
          type: string
        shortName:
          type: string
        uuid:
          type: string
