components:
  responses:
    ListOfFacilitiesResponse:
      description: returns List<Facility>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Facility'
    MapStringListOfPerunBeanResponse:
      description: returns Map<String,List<PerunBean>>
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/PerunBean'
    ExceptionResponse:
      description: exception occurred
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PerunException'
    ListOfResourcesResponse:
      description: returns List<Resource>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Resource'
    ListOfMembersResponse:
      description: returns List<Member>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Member'
    ListOfUsersResponse:
      description: returns List<User>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/User'
  schemas:
    Facility:
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        uuid:
          type: string
          format: uuid
    PerunBean:
      description: identifiable entity in Perun, common ancestor of all entity classes
      type: object
      properties:
        id:
          type: integer
        beanName:
          type: string
      required:
      - id
      - beanName
      discriminator:
        propertyName: beanName
    Auditable:
      description: represents audit information
      allOf:
      - $ref: '#/components/schemas/PerunBean'
      properties:
        createdAt:
          type:
          - string
          - 'null'
        createdBy:
          type:
          - string
          - 'null'
        modifiedAt:
          type:
          - string
          - 'null'
        modifiedBy:
          type:
          - string
          - 'null'
        createdByUid:
          type:
          - integer
          - 'null'
        modifiedByUid:
          type:
          - integer
          - 'null'
    Resource:
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        name:
          type: string
        description:
          type: string
        voId:
          type: integer
        facilityId:
          type: integer
        uuid:
          type: string
          format: uuid
    User:
      description: represents user as a physical person
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        firstName:
          type:
          - string
          - 'null'
        lastName:
          type:
          - string
          - 'null'
        middleName:
          type:
          - string
          - 'null'
        titleBefore:
          type:
          - string
          - 'null'
        titleAfter:
          type:
          - string
          - 'null'
        serviceUser:
          type: boolean
        sponsoredUser:
          type: boolean
        uuid:
          type: string
          format: uuid
        specificUser:
          type: boolean
        majorSpecificType:
          type: string
    Member:
      description: represents Member of a Virtual Organization
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        userId:
          type: integer
        voId:
          type: integer
        status:
          type: string
        membershipType:
          type: string
        dualMembership:
          type: boolean
        sourceGroupId:
          type:
          - integer
          - 'null'
        sponsored:
          type: boolean
        groupStatus:
          type: string
        groupStatuses:
          type: object
          additionalProperties:
            type: string
    PerunException:
      description: exception thrown from inside of Perun
      type: object
      properties:
        errorId:
          type: string
        name:
          type: string
        message:
          type: string
  parameters:
    searchString:
      name: searchString
      description: Text to search by
      schema:
        type: string
      in: query
      required: true
  securitySchemes:
    BasicAuth:
      description: HTTP Basic authentication with username and password
      type: http
      scheme: basic
    BearerAuth:
      description: 'OAuth2 Resource Server authentication using access token in ''Authorization: Bearer'' HTTP header'
      type: http
      scheme: bearer
