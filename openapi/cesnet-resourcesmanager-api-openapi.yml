components:
  parameters:
    authorizedGroup:
      name: authorizedGroup
      description: Group id
      schema:
        type: integer
      in: query
      required: true
    serviceId:
      name: service
      description: id of Service
      schema:
        type: integer
      in: query
      required: true
    attrNamesOptional:
      name: attrNames[]
      description: list of attribute names List<String> or null
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
    userId:
      name: user
      description: id of User
      schema:
        type: integer
      in: query
      required: true
    voId:
      name: vo
      description: id of Vo
      schema:
        type: integer
      in: query
      required: true
    ids:
      name: ids[]
      description: list of ids List<Integer>
      in: query
      required: true
      schema:
        type: array
        items:
          type: integer
    serviceIds:
      name: services[]
      description: list of Service ids List<Integer>
      in: query
      required: true
      schema:
        type: array
        items:
          type: integer
    memberId:
      name: member
      description: id of Member
      schema:
        type: integer
      in: query
      required: true
    facilityId:
      name: facility
      description: id of Facility
      schema:
        type: integer
      in: query
      required: true
    assignInactive:
      name: assignInactive
      description: flag, if set to true, group-resource assignment will have status INACTIVE
      schema:
        type: boolean
      in: query
      required: false
    async:
      name: async
      description: asynchronous flag, if set to true, some operation will be performed asynchronously
      schema:
        type: boolean
      in: query
      required: false
    autoAssignSubgroups:
      name: autoAssignSubgroups
      description: flag, if set to true, subgroups are assigned to resource as well
      schema:
        type: boolean
      in: query
      required: false
    groupId:
      name: group
      description: id of Group
      schema:
        type: integer
      in: query
      required: true
    resourceIds:
      name: resources[]
      description: list of Resource ids List<Integer>
      in: query
      required: true
      schema:
        type: array
        items:
          type: integer
    resourceId:
      name: resource
      description: id of Resource
      schema:
        type: integer
      in: query
      required: true
    id:
      name: id
      description: numeric id
      schema:
        type: integer
      in: query
      required: true
    groupIds:
      name: groups[]
      description: list of Group ids List<Integer>
      in: query
      required: true
      schema:
        type: array
        items:
