        default:
          $ref: '#/components/responses/ExceptionResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: InputCopyResource
              description: input to copyResource
              type: object
              required:
              - templateResource
              - destinationResource
              - withGroups
              properties:
                templateResource:
                  $ref: '#/components/schemas/Resource'
                destinationResource:
                  $ref: '#/components/schemas/Resource'
                withGroups:
                  type: boolean
                  description: if copy the resource with group
