  /json/authzResolver/setRole/u:
    post:
      tags:
      - AuthzResolver
      operationId: setRoleForUser
      summary: Set role for user
      responses:
        '200':
          $ref: '#/components/responses/VoidResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: setRoleForUser
              description: input to setRoleForUser
              type: object
              required:
              - role
              - user
              properties:
                role:
                  type: string
                user:
                  type: integer
  /json/authzResolver/unsetRole/u:
    post:
      tags:
      - AuthzResolver
      operationId: unsetRoleForUser
      summary: Unset role for user
      responses:
