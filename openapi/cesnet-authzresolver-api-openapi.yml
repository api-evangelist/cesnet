      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: setRoleWithUserComplementaryObject
              description: 'input to setRoleWithUserComplementaryObject (supported objects: Group | RichGroup | Vo | Resource | Facility)'
              type: object
              required:
              - role
              - users
              properties:
                role:
                  type: string
                users:
                  type: array
                  description: List of user ids
                  items:
                    type: integer
                complementaryObject:
