      - $ref: '#/components/parameters/optionalUserId'
      - $ref: '#/components/parameters/ListOfRoles'
      responses:
        '200':
          $ref: '#/components/responses/ListOfGroupsResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/authzResolver/getMembersWhereUserIsInRoles:
    get:
      tags:
      - AuthzResolver
      operationId: getMembersWhereUserIsInRoles
      summary: Get all Members where the given user (principal if user not sent) has set one…
      parameters:
      - $ref: '#/components/parameters/optionalUserId'
      - $ref: '#/components/parameters/ListOfRoles'
      responses:
        '200':
          $ref: '#/components/responses/ListOfMembersResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
components:
  schemas:
    PerunPolicy:
      type: object
      properties:
        policyName:
          type: string
        includePolicies:
          type: array
          items:
            type: string
        perunRoles:
          type: array
          items:
            type: object
            additionalProperties:
              type: string
      required:
      - policyName
      - includePolicies
      - perunRoles
    ExtSource:
      description: represents external source of data for users such as an IdP or an HR database
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        name:
          type: string
        type:
          type: string
    RoleManagementRules:
      type: object
      properties:
        roleName:
          type: string
        primaryObject:
          type:
          - string
          - 'null'
        privilegedRolesToManage:
          type: array
          items:
            type: object
            additionalProperties:
              type:
              - string
              - 'null'
        privilegedRolesToRead:
          type: array
          items:
            type: object
            additionalProperties:
              type:
              - string
              - 'null'
        entitiesToManage:
          type: object
          additionalProperties:
            type: string
        assignedObjects:
          type: object
          additionalProperties:
            type: string
        assignableToAttributes:
          type: boolean
        skipMFA:
          type: boolean
        displayName:
          type: string
      required:
      - roleName
      - primaryObject
      - privilegedRolesToManage
      - privilegedRolesToRead
      - entitiesToManage
      - assignedObjects
      - assignableToAttributes
      - skipMFA
      - displayName
    PerunException:
      description: exception thrown from inside of Perun
      type: object
      properties:
        errorId:
          type: string
        name:
          type: string
        message:
          type: string
    IdmObject:
      type: object
      properties:
        idmObjectType:
          type: string
        objectId:
          type: string
      required:
      - idmObjectType
      - objectId
    AttributeDefinition:
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        friendlyName:
          type: string
        namespace:
          type: string
        description:
          type:
          - string
          - 'null'
        type:
          type: string
        displayName:
          type: string
        writable:
          type: boolean
        unique:
          type: boolean
        friendlyNameParameter:
          type: string
          readOnly: true
        baseFriendlyName:
          type: string
          readOnly: true
        entity:
          type: string
          readOnly: true
    PerunBean:
      description: identifiable entity in Perun, common ancestor of all entity classes
      type: object
      properties:
        id:
          type: integer
        beanName:
          type: string
      required:
      - id
      - beanName
      discriminator:
        propertyName: beanName
    Resource:
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        name:
          type: string
        description:
          type: string
        voId:
          type: integer
        facilityId:
          type: integer
        uuid:
          type: string
          format: uuid
    RichUser:
      description: user data packed together with all user attributes and UserExtSources
      allOf:
      - $ref: '#/components/schemas/User'
      properties:
        userExtSources:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/UserExtSource'
        userAttributes:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Attribute'
      required:
      - userExtSources
      - userAttributes
    AuthzRoles:
      type: object
      additionalProperties:
        type: object
        additionalProperties:
          type: array
          items:
            type: integer
    Attribute:
      allOf:
      - $ref: '#/components/schemas/AttributeDefinition'
      properties:
        valueCreatedAt:
          type:
          - string
          - 'null'
        valueCreatedBy:
          type:
          - string
          - 'null'
        valueModifiedAt:
          type:
          - string
          - 'null'
        valueModifiedBy:
          type:
          - string
          - 'null'
        value: {}
    Facility:
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        uuid:
          type: string
          format: uuid
    UserExtSource:
      description: represents specific user authentication or identification in external source of data
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        login:
          type: string
        userId:
          type: integer
        loa:
          type: integer
        persistent:
          type: boolean
        lastAccess:
          type: string
          format: timestamp
          description: SQL timestamp
          example: '2012-01-01 00:00:00.100000'
        extSource:
          $ref: '#/components/schemas/ExtSource'
      required:
      - login
      - extSource
    PerunPrincipal:
      type: object
      required:
      - userId
      - user
      properties:
        actor:
          type: string
        extSourceName:
          type: string
        extSourceType:
          type: string
        extSourceLoa:
          type: integer
        user:
          $ref: '#/components/schemas/User'
        authzInitialized:
          type: boolean
        additionalInformations:
          type: object
          additionalProperties:
            type: string
        userId:
          type: integer
        roles:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: array
              items:
                type: integer
    Vo:
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        name:
          type: string
        shortName:
          type: string
        uuid:
          type: string
          format: uuid
    Group:
      allOf:
      - $ref: '#/components/schemas/Auditable'
      type:
      - object
      - 'null'
      properties:
        name:
          type: string
        shortName:
          type: string
        description:
          type:
          - string
          - 'null'
        voId:
          type: integer
        parentGroupId:
          type:
          - integer
          - 'null'
        uuid:
          type: string
          format: uuid
    User:
      description: represents user as a physical person
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        firstName:
          type:
          - string
          - 'null'
        lastName:
          type:
          - string
          - 'null'
        middleName:
          type:
          - string
          - 'null'
        titleBefore:
          type:
          - string
          - 'null'
        titleAfter:
          type:
          - string
          - 'null'
        serviceUser:
          type: boolean
        sponsoredUser:
          type: boolean
        uuid:
          type: string
          format: uuid
        specificUser:
          type: boolean
        majorSpecificType:
          type: string
    Member:
      description: represents Member of a Virtual Organization
      allOf:
      - $ref: '#/components/schemas/Auditable'
      properties:
        userId:
          type: integer
        voId:
          type: integer
        status:
          type: string
        membershipType:
          type: string
        dualMembership:
          type: boolean
        sourceGroupId:
          type:
          - integer
          - 'null'
        sponsored:
          type: boolean
        groupStatus:
          type: string
        groupStatuses:
          type: object
          additionalProperties:
            type: string
    Auditable:
      description: represents audit information
      allOf:
      - $ref: '#/components/schemas/PerunBean'
      properties:
        createdAt:
          type:
          - string
          - 'null'
        createdBy:
          type:
          - string
          - 'null'
        modifiedAt:
          type:
          - string
          - 'null'
        modifiedBy:
          type:
          - string
          - 'null'
        createdByUid:
          type:
          - integer
          - 'null'
        modifiedByUid:
          type:
          - integer
          - 'null'
  parameters:
    complementaryObjectId:
      name: complementaryObjectId
      description: Property id of complementaryObject to get managers for
      schema:
        type: integer
      in: query
      required: true
    optionalUserId:
      name: user
      description: id of User
      schema:
        type: integer
      in: query
      required: false
    groupId:
      name: group
      description: id of Group
      schema:
        type: integer
      in: query
      required: true
    ListOfRoles:
      name: roles[]
      description: list of role names List<String>
      in: query
      required: true
      schema:
        type: array
        items:
          type: string
    complementaryObjectName:
      name: complementaryObjectName
      description: 'Property beanName of complementaryObject, meaning object type (supported object types: Group | RichGroup | Vo | Resource | Facility)'
      schema:
        type: string
      in: query
      required: true
    role:
      name: role
      description: User role
      schema:
        type: string
      in: query
      required: true
    optionalFacilityId:
      name: facility
      description: id of Facility
      schema:
        type: integer
      in: query
      required: false
    voIds:
      name: vos[]
      description: list of Vo ids List<Integer>
      in: query
      required: true
      schema:
        type: array
        items:
          type: integer
    userId:
      name: user
      description: id of User
      schema:
        type: integer
      in: query
      required: true
    optionalGroupId:
      name: group
      description: id of Group
      schema:
        type: integer
      in: query
      required: false
    facilityIds:
      name: facilities[]
      description: list of Facility ids List<Integer>
      in: query
      required: true
      schema:
        type: array
        items:
          type: integer
  responses:
    ListOfPerunPoliciesResponse:
      description: returns List<PerunPolicy>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/PerunPolicy'
    ListOfFacilitiesResponse:
      description: returns List<Facility>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Facility'
    StringResponse:
      description: returns String
      content:
        application/json:
          schema:
            type: string
    ListOfUsersResponse:
      description: returns List<User>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/User'
    AuthzRolesResponse:
      description: AuthzRoles of user
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthzRoles'
    UserResponse:
      description: returns User
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/User'
    ListOfGroupsResponse:
      description: returns List<Group>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Group'
    ListOfRolesManagementRulesResponse:
      description: returns List<RoleManagementRules>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/RoleManagementRules'
    VoidResponse:
      description: returns nothing
    IntegerResponse:
      description: returns Integer
      content:
        application/json:
          schema:
            type: integer
    MapStringSetOfIdmObjectResponse:
      description: returns Map<String, Set<IdmObject>>
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                $ref: '#/components/schemas/IdmObject'
              uniqueItems: true
    ExceptionResponse:
      description: exception occurred
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PerunException'
    ComplementaryObjectsWithAuthzGroupsResponse:
      description: Complementary objects combined with authorized groups (connected by role)
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              type: object
              additionalProperties:
                type: object
                additionalProperties:
                  type: array
                  items:
                    $ref: '#/components/schemas/Group'
    ListOfRichUsersResponse:
      description: returns List<RichUser>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/RichUser'
    ListOfMembersResponse:
      description: returns List<Member>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Member'
    ListOfStringsResponse:
      description: returns List<String>
      content:
        application/json:
          schema:
            type: array
            items:
              type: string
    BooleanResponse:
      description: returns Boolean
      content:
        application/json:
          schema:
            type: boolean
    ListOfResourcesResponse:
      description: returns List<Resource>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Resource'
    ListOfVosResponse:
      description: returns List<Vo>
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Vo'
  securitySchemes:
    BasicAuth:
      description: HTTP Basic authentication with username and password
      type: http
      scheme: basic
    BearerAuth:
      description: 'OAuth2 Resource Server authentication using access token in ''Authorization: Bearer'' HTTP header'
      type: http
      scheme: bearer
