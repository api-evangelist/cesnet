openapi: 3.2.0
info:
  version: 0.0.0
  title: Perun RPC Authz Resolver API
  description: Perun Remote Procedure Calls Application Programming Interface
  contact:
    url: https://perun-aai.org
    email: perun@cesnet.cz
servers:
- url: https://{server}/{authentication}/rpc
  description: Perun RPC server
  variables:
    server:
      default: api-dev.perun-aai.org
      description: DNS name of a Perun server
    authentication:
      default: ba
      description: 'way of authentication:

        ba - HTTP Basic Auth

        krb - Kerberos

        non - no authentication

        cert - X509 client certificate

        oauth - OAuth 2.0 bearer access token

        fed - SAML federation

        '
      enum:
      - ba
      - krb
      - non
      - cert
      - oauth
      - fed
security:
- BasicAuth: []
- BearerAuth: []
tags:
- name: AuthzResolver
  description: AuthzResolver RPC API in Perun
  externalDocs:
    url: https://perun-aai.org/documentation/technical-documentation/rpc-api/rpc-javadoc-AuthzResolver.html
paths:
  /json/authzResolver/getPrincipalRoleNames:
    get:
      tags:
      - AuthzResolver
      operationId: getPrincipalRoleNames
      summary: Returns list of caller's role names.
      responses:
        '200':
          $ref: '#/components/responses/ListOfStringsResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/authzResolver/getPerunPrincipal:
    get:
      tags:
      - AuthzResolver
      operationId: getPerunPrincipal
      summary: Gets current user
      description: Returns object representing the currently authenticated user.
      responses:
        '200':
          description: successfully returned authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerunPrincipal'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/authzResolver/getRichAdmins:
    get:
      tags:
      - AuthzResolver
      operationId: getAuthzRichAdmins
      summary: Gets all valid rich admins
      description: Get all valid richUser administrators (for group-based rights, status must be VALID for both Vo and group) for complementary object and role with specified attributes.
      parameters:
      - $ref: '#/components/parameters/role'
      - $ref: '#/components/parameters/complementaryObjectId'
      - $ref: '#/components/parameters/complementaryObjectName'
      - name: specificAttributes
        description: list of specified attributes which are needed in object richUser
        schema:
          type: array
          items:
            type: string
        in: query
        required: true
      - name: allUserAttributes
        description: When true, do not specify attributes through list and return them all in objects richUser. Ignoring list of specific attributes
        schema:
          type: boolean
          default: false
        in: query
        required: false
      - name: onlyDirectAdmins
        description: When true, return only direct users of the complementary object for role with specific attributes
        schema:
          type: boolean
          default: true
        in: query
        required: false
      responses:
        '200':
          $ref: '#/components/responses/ListOfRichUsersResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/authzResolver/getAdmins:
    get:
      tags:
      - AuthzResolver
      operationId: getAuthzAdmins
      summary: Gets all valid admins
      description: Get all valid user administrators (for group-based rights, status must be VALID for both Vo and group) for complementary object and role.
      parameters:
      - $ref: '#/components/parameters/role'
      - $ref: '#/components/parameters/complementaryObjectId'
      - $ref: '#/components/parameters/complementaryObjectName'
      - name: onlyDirectAdmins
        description: When true, return only direct users of the complementary object for role
        schema:
          type: boolean
          default: true
        in: query
        required: false
      responses:
        '200':
          $ref: '#/components/responses/ListOfUsersResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/authzResolver/someAdminExists:
    get:
      tags:
      - AuthzResolver
      operationId: someAdminExists
      summary: Checks if some valid admin exists
      description: Checks if valid user administrators (for group-based rights, status must be VALID for both Vo and group) for complementary object and role exists.
      parameters:
      - $ref: '#/components/parameters/role'
      - $ref: '#/components/parameters/complementaryObjectId'
      - $ref: '#/components/parameters/complementaryObjectName'
      - name: onlyDirectAdmins
        description: When true, check only direct users of the complementary object for role
        schema:
          type: boolean
          default: true
        in: query
        required: false
      responses:
        '200':
          $ref: '#/components/responses/BooleanResponse'
        default:
          $ref: '#/components/responses/ExceptionResponse'
  /json/authzResolver/getAdminGroups:
    get:
      tags:
      - AuthzResolver
      operationId: getAuthzAdminGroups
      summary: Get all groups of managers (authorizedGroups) for complementaryObject and role
      parameters:
