aid: cesnet

name: CESNET

description: 'CESNET (CESNET, z.s.p.o., an association of legal entities) is the Czech national research and education network operator, an association
  of top Czech universities and the Czech Academy of Sciences. It runs the high-performance CESNET3 academic backbone and delivers ICT services
  to its members: networking, MetaCentrum computing, data storage (FileSender, ownCloud), identity federation and eduroam, multimedia/videoconferencing,
  and security services, and is part of the e-INFRA CZ research infrastructure. It publishes open-source projects, including the Perun identity
  and access management system, on GitHub.'

